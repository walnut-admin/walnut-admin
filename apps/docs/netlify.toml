# Walnut Admin Documentation - Netlify Configuration
# Docs: https://docs.netlify.com/build/configure-builds/file-based-configuration/

[build]
# Build only the docs app via pnpm filter
command = "pnpm run build --filter @walnut/docs"

# VitePress default output directory (relative to apps/docs/)
publish = ".vitepress/dist"

[build.environment]
NODE_VERSION = "24.13.0"
PNPM_VERSION = "11"
