services:
  dev-mongodb-primary:
    image: docker.io/bitnami/mongodb:latest
    restart: always
    container_name: dev-mongodb-primary
    environment:
      - MONGODB_ADVERTISED_HOSTNAME=dev-mongodb-primary
      - MONGODB_REPLICA_SET_MODE=primary
      - MONGODB_ROOT_USER=root
      - MONGODB_ROOT_PASSWORD=123456
      - MONGODB_REPLICA_SET_KEY=replicaset
    volumes:
      - 'mongodb_master_data:/bitnami/mongodb'
    ports:
      - 27017:27017

  dev-mongodb-secondary:
    image: docker.io/bitnami/mongodb:latest
    restart: always
    container_name: dev-mongodb-secondary
    depends_on:
      - dev-mongodb-primary
    environment:
      - MONGODB_REPLICA_SET_MODE=secondary
      # 副本集成员地址「容器名:端口」要同时被容器网络内（docker DNS）与宿主侧
      # （hosts→127.0.0.1）解析可达：让 mongod 容器内直接监听映射端口，内外同构
      - MONGODB_PORT_NUMBER=27027
      - MONGODB_ADVERTISED_HOSTNAME=dev-mongodb-secondary:27027
      - MONGODB_INITIAL_PRIMARY_HOST=dev-mongodb-primary
      - MONGODB_INITIAL_PRIMARY_ROOT_USER=root
      - MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD=123456
      - MONGODB_REPLICA_SET_KEY=replicaset
      - MONGODB_INITIAL_PRIMARY_PORT_NUMBER=27017
    ports:
      - 27027:27027

  dev-mongodb-arbiter:
    image: docker.io/bitnami/mongodb:latest
    restart: always
    container_name: dev-mongodb-arbiter
    depends_on:
      - dev-mongodb-primary
    environment:
      - MONGODB_REPLICA_SET_MODE=arbiter
      # 同 secondary：容器内监听映射端口，成员地址内外同构
      - MONGODB_PORT_NUMBER=27037
      - MONGODB_ADVERTISED_HOSTNAME=dev-mongodb-arbiter:27037
      - MONGODB_INITIAL_PRIMARY_HOST=dev-mongodb-primary
      - MONGODB_INITIAL_PRIMARY_ROOT_USER=root
      - MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD=123456
      - MONGODB_REPLICA_SET_KEY=replicaset
      - MONGODB_INITIAL_PRIMARY_PORT_NUMBER=27017
    ports:
      - 27037:27037

  postgres:
    restart: always
    container_name: dev-single-postgres
    # postgres 19 尚未 GA（官方镜像只有 19rc1，latest 为 18.x），19 GA 镜像发布后升 tag
    image: docker.io/library/postgres:18-alpine
    environment:
      - POSTGRES_USER=walnut
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=walnut_pg
    ports:
      - 5432:5432
    volumes:
      # postgres 18+ 官方镜像的挂载点是 /var/lib/postgresql（不再是 /var/lib/postgresql/data）
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U walnut -d walnut_pg']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: always
    container_name: dev-single-redis
    # bitnami/redis 免费镜像已冻结迁入 bitnamilegacy，换 Docker 官方镜像；
    # bitnami 卷内是 /bitnami/redis/data 目录结构，与官方镜像的 /data 不兼容，故换新卷名 ——
    # redis 里只有缓存/会话数据，可弃
    image: docker.io/library/redis:8-alpine
    # 密码与 env-local 的 APP_REDIS_PASS 一致；FLUSHDB/FLUSHALL 重命名为空串即禁用
    # （等价 bitnami 的 REDIS_DISABLE_COMMANDS）
    command:
      - redis-server
      - --requirepass
      - '123456'
      - --rename-command
      - FLUSHDB
      - ''
      - --rename-command
      - FLUSHALL
      - ''
    ports:
      - 6379:6379
    volumes:
      - redis_official_data:/data

volumes:
  mongodb_master_data:
    driver: local
  redis_official_data:
    driver: local
  postgres_data:
    driver: local