name: Release

# 触发：tag 推送（pnpm release → changeset version → commit → tag vX.Y.Z → push）。
# 为什么由 tag 触发容器构建：
# - 之前容器构建挂在手动 workflow_dispatch 的 deploy.yml 上，且 build 与 deploy 耦合，
#   导致每次上线都要重建三个镜像（实测一次 85 分钟，其中 backend 构建 77m53s）。
# - 现在：commit/push 只跑 ci.yml 的质量门禁；发布 tag 才构建镜像；日常上线/回滚走
#   deploy.yml（纯部署，不构建）。
#
# 失败后要重建镜像：在 Actions 里对该 run 点 "Re-run all jobs"（同一个 tag/SHA），
# 缓存命中后总耗时通常在个位数分钟。

on:
  push:
    tags:
      - 'v*.*.*'
  # 手动补跑：用于「只想验证镜像构建、不碰生产」——**ref 必须选那个 tag**（`github.ref_name` 既是镜像
  # tag 也是 Release 的 tag_name；选分支会拿分支名当版本号）。
  # 注意 `inputs` 是**允许**出现在 job 级 `if` 的（与 `secrets` 不同，见 ci.yml 顶部的血泪注释）。
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: '⚠️ ref 请选 tag。只跑门禁 + 构建推镜像 + 建 Release，跳过部署到生产'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NS: tron1997
  TAG: ${{ github.ref_name }}
  # staging 必须落在**工作区之内**：
  #
  # 原来放在工作区之外（`../walnut-image-staging`）是为了"不污染工作树"，但 `docker/bake-action`
  # 读不到工作区之外的本地 context —— 两次发版（v0.1.0 / v0.1.1）都停在同一步：
  #   target backend: failed to solve: failed to read dockerfile: … "/walnut-image-staging/server": not found
  # 而 staging 本身是成功的（同一步里的 `du -sh` / `cp` 都在 set -e 下过了）。改回工作区内的
  # `build/image`（也正是 docker-bake.hcl 的默认值、本地构建用的位置），`build/` 已在 .gitignore 里。
  #
  # 位置不影响下面的关键约束：
  #
  # pnpm deploy --prod 会把工作区 node_modules/.modules.yaml 的 devDependencies
  #    标记为 false；此后**任何** pnpm 命令都会自动按 prod 重装，把 vite / cross-env
  #    等开发依赖当场删掉（本地实测：deploy 之后跑 pnpm exec 立即触发 prune）。
  #    因此 deploy 必须是本 job 里最后一个 pnpm 命令 —— 后面只剩 rm/cp 与 docker。
  IMAGE_STAGE: build/image

jobs:
  # ---------- 1. 质量门禁（发布是低频动作，跑全量而不是 affected，用时间换"不漏跑"）----------
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture boundaries
        run: pnpm boundaries

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm types:check

      - name: Tests
        run: pnpm test

      - name: Dependency consistency (syncpack)
        run: pnpm syncpack:lint

  # ---------- 2. 构建并推送镜像（与 verify 并行；部署必须等两者都成功）----------
  images:
    name: Build & push images
    runs-on: ubuntu-latest
    # 90 分钟（原 45）：bake 那一步的耗时**波动很大** —— 2026-09-30 实测两次同 tag 重跑，
    # v0.1.5 整轮 34 分钟（bake 跑完），v0.1.6 的 bake 跑了 45 分钟仍没结束 ⇒ 45 分钟的上限
    # 把它**取消**掉了（现象是"挂起"，实际是作业超时）。慢但能跑完的构建不该被砍掉。
    #
    # 波动来源（尚未治理）：构建上下文是 `pnpm deploy` 的 staging 产物（约 268MB / 4 万文件），
    # 经 `source: .` 传给 BuildKit 容器，外加 GHA 缓存的冷热差异。治本要么瘦身上下文、
    # 要么换更省传输的形式 —— 那需要先量，别凭猜改。
    timeout-minutes: 90
    env:
      DOTENVX_KEYS: ${{ secrets.ENV_KEYS }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decrypt environment files
        uses: ./.github/actions/decrypt-env
        with:
          keys: ${{ env.DOTENVX_KEYS }}

      # 重活全部在 runner 上完成（pnpm store 由 setup-node 缓存，install 约 30s）：
      # 镜像里不再有 pnpm install / nest build / vite build。
      # 顺序约束：pnpm deploy --prod 必须是本 job 最后一个 pnpm 命令
      # （它会把工作区标记成仅生产依赖，之后的 pnpm 命令会删掉 devDeps，见文件顶部 env 注释）。
      - name: Build server + shared packages
        run: pnpm exec turbo run build --filter=@walnut/server...

      - name: Build admin
        run: pnpm exec turbo run build --filter=@walnut/admin

      - name: Stage backend runtime (pnpm deploy --prod)
        run: |
          set -euo pipefail
          rm -rf "$IMAGE_STAGE/server"
          mkdir -p "$IMAGE_STAGE/server"
          pnpm deploy --legacy --filter=@walnut/server --prod "$IMAGE_STAGE/server"
          # pnpm deploy 会把 apps/server/env-local（dotenvx 解密出的明文密钥）一起拷进产物，
          # 旧流程把它 COPY 进了镜像。这里先剔除，Dockerfile 里还有一层兜底。
          rm -rf "$IMAGE_STAGE/server/env-local" "$IMAGE_STAGE/server/env-encrypted"
          # Dockerfile 必须落在 **context 根**：`docker buildx bake` 里 `dockerfile` 是相对
          # context 解析的（不像 `docker build -f` 那样相对 cwd）—— 少了这一行，bake 会报
          # "failed to read dockerfile: …/walnut-image-staging/server: not found"（2026-09-30
          # v0.1.0 首次发版实测踩到）。
          cp apps/server/Dockerfile "$IMAGE_STAGE/server/Dockerfile"
          du -sh "$IMAGE_STAGE/server"

      - name: Stage frontend runtime
        run: |
          set -euo pipefail
          mkdir -p "$IMAGE_STAGE/frontend/html"
          cp -a apps/admin/dist/. "$IMAGE_STAGE/frontend/html/"
          cp deploy/nginx/frontend-server.conf "$IMAGE_STAGE/frontend/"
          # 同上：Dockerfile 落在 context 根
          cp apps/admin/Dockerfile "$IMAGE_STAGE/frontend/Dockerfile"
          du -sh "$IMAGE_STAGE/frontend/html"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Tencent TCR
        run: echo "${{ secrets.TCR_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.TCR_USERNAME }}" --password-stdin

      # nginx 必须先推送：frontend target 的 NGINX_BASE 指向 ${REGISTRY}/nginx:${TAG}，
      # 它从 registry 拉取基础镜像。nginx 构建仅 apk 安装（约 20s），不占关键路径。
      - name: Build & push nginx
        run: |
          set -euo pipefail
          docker build \
            -f deploy/nginx/Dockerfile \
            -t "$REGISTRY/$IMAGE_NS/nginx:$TAG" \
            -t "$REGISTRY/$IMAGE_NS/nginx:brotli" \
            deploy/nginx
          docker push "$REGISTRY/$IMAGE_NS/nginx:$TAG"
          docker push "$REGISTRY/$IMAGE_NS/nginx:brotli"

      # backend 与 frontend 在同一个 bake 里并行构建，各自使用独立的 GHA 缓存 scope
      # （历史 bug：三次 build 共用默认 scope=buildkit → 互相覆盖缓存 → backend 永远冷构建）
      #
      # `source: .` 是**必需**的（2026-09-30 连挂两次发版才定位到）：bake-action v6 起默认用
      # Git context（`https://github.com/<owner>/<repo>.git#<ref>`），官方 README 明说
      # "any file mutation in the steps that precede the build step will be ignored" ——
      # 于是上面 staging 出来的 `build/image/**`（还带 gitignore）在 context 里根本不存在，
      # 报错就长成 `failed to read dockerfile: … "…/server": not found`。加 `source: .` 切到
      # Path context（工作区路径）之后，staging 的产物才可见。
      #
      # dockerfile 走**绝对路径**：bake 的 `dockerfile` 字段相对谁解析（context / bake 文件 / cwd）
      # 文档里没写清，试错成本是一次发版 —— 绝对路径三种解释下都指向同一个文件。
      # bake 的开始时刻记进 `$GITHUB_ENV`（跨步骤可见）—— 后面的 `Image digests`（`if: always()`）
      # 用它算 bake 的整体耗时。这一步刻意独立：不碰上下任何现有脚本。
      - name: Mark bake start
        run: echo "BAKE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build & push backend + frontend (bake)
        uses: docker/bake-action@v6
        env:
          SERVER_CONTEXT: ${{ env.IMAGE_STAGE }}/server
          FRONTEND_CONTEXT: ${{ env.IMAGE_STAGE }}/frontend
          SERVER_DOCKERFILE: ${{ github.workspace }}/${{ env.IMAGE_STAGE }}/server/Dockerfile
          FRONTEND_DOCKERFILE: ${{ github.workspace }}/${{ env.IMAGE_STAGE }}/frontend/Dockerfile
        with:
          source: .
          files: docker-bake.hcl
          push: true
          provenance: false

      # ---------- 度量：把体积/耗时/digest 写进 run summary，便于和基线对比 ----------
      #
      # bake 的**整体耗时**从这里算：上一步（bake 之前）把开始时刻写进 `$GITHUB_ENV`，
      # 本步（`if: always()`，取消/失败也会跑）算出差值。想知道 transfer / build / cache-export
      # 的**内部分段**，看本 run 的 artifact `docker-build-*`（docker 的 build record，含每步耗时）。
      #
      # 为什么只测这一处：bake 是唯一"分钟级且方差大"的步骤（2026-09-30 实测 22 分钟 ~ 45 分钟未完），
      # P2 的取舍全靠这个数；其余步骤在 run 页面各自有耗时，重复度量只会加噪声。
      - name: Image digests
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## 时序（tag: \`${TAG}\`）"
            echo ""
            echo "| 阶段 | 值 |"
            echo "| --- | --- |"
            if [ -n "${BAKE_START:-}" ]; then
              echo "| bake（backend + frontend） | $(( $(date +%s) - BAKE_START ))s |"
            else
              echo "| bake（backend + frontend） | n/a（没走到 bake） |"
            fi
            echo "| bake 内部分段 | 见本 run 的 artifact \`docker-build-*\`（build record，含 transfer / build / cache-export） |"
            echo ""
            echo "## 镜像（tag: \`${TAG}\`）"
            echo ""
            echo "| 镜像 | digest |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for img in nginx backend frontend; do
            d=$(docker buildx imagetools inspect "$REGISTRY/$IMAGE_NS/$img:$TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || echo 'n/a')
            echo "| ${img} | \`${d}\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Build context sizes
        if: always()
        run: |
          {
            echo ""
            echo "| 构建上下文 | 体积 |"
            echo "| --- | --- |"
            echo "| backend（pnpm deploy --prod 产物） | $(du -sh "$IMAGE_STAGE/server" 2>/dev/null | cut -f1 || echo n/a) |"
            echo "| frontend（Vite dist） | $(du -sh "$IMAGE_STAGE/frontend/html" 2>/dev/null | cut -f1 || echo n/a) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- 3. GitHub Release ----------
  # 正文来源：根 changelog-latest.md —— 它由 `pnpm release` 用 git-cliff 生成本次发版的
  # 整仓段落，并**随 release commit 一起提交**（因此 checkout 到这个 tag 时读到的就是本次的正文）。
  # 这也是发版机不需要任何能改远端内容的凭据的原因：本地只生成文件，创建 Release 归这里。
  release:
    name: Create GitHub Release
    needs: [verify, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # 初始化数据打成一个**带版本号**的资产随 Release 发布（`walnut-admin-seed-<version>.tar.gz`）。
      # 这里只打**仓内那部分**（8 个集合，约 0.1MB）：行政区划（66 万条）刻意不进 git，它需要一份
      # 有数据的库才能导出，所以那部分由发版机本地跑 `pnpm seed:pack --areas-from-db` 产出，
      # 再用 `gh release upload <tag> <文件> --clobber` 覆盖上去（`pnpm seed:pack` 会把这条命令打出来）。
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Pack seed asset
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --silent seed:pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog-latest.md
          generate_release_notes: false
          files: apps/server/db/.pack/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 4. 自动部署（复用 deploy.yml，与手动回滚走同一条路径）----------
  deploy:
    name: Deploy to prod
    needs: [verify, images, release]
    # `skip_deploy` 只可能来自 workflow_dispatch；tag 推送时 `inputs` 为空 → 照常部署。
    if: ${{ !inputs.skip_deploy }}
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.ref_name }}
    secrets: inherit
