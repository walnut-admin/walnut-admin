name: CI

# Quality gate: PRs must pass lint + type check + build before merge.
# Intentionally does NOT trigger on push to main (direct main pushes are
# done by the maintainer; tag-triggered deploys are handled separately by
# deploy.yml). Re-enable push trigger when collaborative workflow needs it.
#
# This workflow does NOT run tests (server tests need MongoDB+Redis which
# require service containers; that can be added later if needed).

on:
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when new commits are pushed.
# Saves CI minutes and avoids stale results racing newer ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: 24

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm types:check

      - name: Build
        run: pnpm build
