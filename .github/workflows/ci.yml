name: CI

# ⚠️ 本文件（以及所有 workflow）禁止把 secrets 上下文写进 step/job 的 if。
# GitHub 只在 jobs.<id>.if / steps.*.if 暴露 github/needs/strategy/matrix/job/runner/env/vars/steps/inputs，
# 写 secrets.X 会让**整个文件**被判为 "Invalid workflow file"：启动即失败、0 个 job，
# 在 Actions 列表里只留一个看起来"跑失败了"的红叉 —— 2026-08-13 到 09-21 本仓 CI 就是这样
# 静默失效了五周（Line 77/85: Unrecognized named-value: 'secrets'）。
# 需要按 secret 是否存在决定是否执行时：先绑到 job 级 env，再用 env.X 判断（见下方 build job）。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Types / Test / Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # turbo affected 需要完整 git 历史来计算变更集
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        # 版本取自根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo --affected 默认对比"当前分支与默认分支的 merge-base"。本仓直接 push main，
      # merge-base 就是 HEAD 自身 → 受影响集会算空、门禁静默跳过。
      # 显式给出 base/head（TURBO_SCM_BASE / TURBO_SCM_HEAD）才有可靠语义。
      # LINK https://turborepo.dev/docs/guides/skipping-tasks
      - name: Resolve affected base
        id: affected
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # 新分支 / force push 时 before 是全零
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "::warning::无法确定 affected 基准，本次按全量执行"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "TURBO_SCM_BASE=$base" >> "$GITHUB_ENV"
          echo "TURBO_SCM_HEAD=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Architecture boundaries (turbo boundaries)
        run: pnpm boundaries

      - name: Lint (affected)
        run: pnpm exec turbo run lint --affected

      # 根级配置（eslint.config.ts / commitlint.config.ts / knip.config.ts）既不在任何包的
      # lint 范围里，也不进 turbo 的 affected 图 —— 必须显式跑，否则只有本地 pre-push 拦得住。
      - name: Lint root configs
        run: pnpm lint:root

      # 根 tsconfig（include: ["*.ts"]）覆盖 eslint.config.ts / commitlint.config.ts / knip.config.ts。
      # 它们同样不入 turbo 的图，且 lint 不做类型检查 —— 必须显式跑这条。
      - name: Type check root configs
        run: pnpm types:check:root

      - name: Type check (affected)
        run: pnpm exec turbo run types:check --affected

      - name: Tests (affected)
        run: pnpm exec turbo run test --affected

      # 文档站构建顺带做死链校验（VitePress 内置；`ignoreDeadLinks` 已从 true 收窄成
      # 「冻结语料 + 尚未编写的组件页」白名单）。跑在 CI 而不是 local pre-push：约 40s，
      # 且只对文档改动有意义。
      - name: Docs build (dead-link check)
        run: pnpm build:docs

      # 补 VitePress 内置查不到的那一半：活文档**正文**里引用的 workspace 包名与仓库路径。
      # （内置只认 markdown 链接语法，反引号里的 `@walnut/xxx` / `packages/a/b.ts` 它看不见。）
      - name: Doc reference check
        run: pnpm lint:docs-refs

      # ADR 的形态（编号连续 / Status 在枚举内 / 四个必需小节 / index.md 双向对齐）没有任何
      # 现成工具管 —— 19 篇 ADR 曾有三种互不兼容的 Status 取值。见待办 F6。
      - name: ADR shape check
        run: pnpm lint:adr

      # 文档里标成 `ts` 的围栏块必须能按 TypeScript 解析：JSON 块不许标成 ts、不许截断/乱码。
      # 只做「零误报」的那一半（不要求文档块能编译 —— 实测那样会 100% 误报）。
      - name: Doc code-block check
        run: pnpm lint:doc-ts

      # 常驻上下文的几个文件（根 AGENTS.md / CLAUDE.md / 包级指引）不许无限膨胀；
      # 预算**用不到一半**同样失败（那种预算已经约束不到任何东西）。
      - name: Doc budget check
        run: pnpm lint:doc-budget

      # turbo 缓存边界：产物目录有没有进 outputs、依赖包源码有没有串进 types:check 的哈希……
      # 这类错误**不会报错**，只会让 turbo 报 FULL TURBO + exit 0 却少跑/少产出。
      - name: Turbo cache boundary check
        run: pnpm lint:turbo-cache

      # 防"affected 空集静默通过"：有文件变更却算出 0 个受影响包时必须失败
      - name: Affected set sanity check
        if: steps.affected.outputs.base != ''
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD" | wc -l)
          dry=$(pnpm exec turbo run lint --affected --dry=json 2>/dev/null | sed -n '/^{/,$p')
          pkgs=$(printf '%s' "$dry" | jq '.packages | length')
          {
            echo "## Affected 范围"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| base | \`${TURBO_SCM_BASE}\` |"
            echo "| head | \`${TURBO_SCM_HEAD}\` |"
            echo "| 变更文件数 | ${changed} |"
            echo "| 受影响包数 | ${pkgs} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$changed" -gt 0 ] && [ "$pkgs" -eq 0 ]; then
            echo "::error::有 ${changed} 个文件变更，但 affected 包数为 0（基准失效？）"
            exit 1
          fi

      - name: Dependency consistency (syncpack)
        run: pnpm syncpack:lint

      # 拦住「某个包的版本漂出 versioning.fixed 组」——在本 PR 上拦，而不是等到发版那天
      # 才发现 fixed 组锁步失败（那时 tag 与镜像已经在路上）。
      - name: Workspace version lockstep (pnpm change check)
        run: pnpm change check

  build:
    name: Build (server + shared packages, admin if secrets available)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # secrets 上下文不能出现在 if 里 → 先绑到 env，再用 env 判断（本文件顶部注释）
      DOTENVX_KEYS: ${{ secrets.ENV_KEYS }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 编译不需要环境变量：SWC 只做语法转换，运行时才读取 env
      - name: Build server + shared packages
        run: pnpm exec turbo run build --filter=@walnut/server...

      # admin 构建需要 VITE_* 环境变量（zod 校验 fail-fast）。env-encrypted/ 已随仓库提交，
      # 私钥在仓库 Secrets（ENV_KEYS = .env.keys 全文）里。fork PR 没有 secrets → 跳过。
      - name: Decrypt environment files
        if: env.DOTENVX_KEYS != ''
        uses: ./.github/actions/decrypt-env
        with:
          keys: ${{ env.DOTENVX_KEYS }}

      - name: Build admin
        if: env.DOTENVX_KEYS != ''
        run: pnpm exec turbo run build --filter=@walnut/admin

      - name: Note skipped admin build
        if: env.DOTENVX_KEYS == ''
        run: echo "::notice::未配置 ENV_KEYS secret，跳过 admin 构建（镜像构建由 tag 发布流程负责）"
