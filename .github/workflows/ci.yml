name: CI

# 本文件（以及所有 workflow）禁止把 secrets 上下文写进 step/job 的 if。
# GitHub 只在 jobs.<id>.if / steps.*.if 暴露 github/needs/strategy/matrix/job/runner/env/vars/steps/inputs，
# 写 secrets.X 会让**整个文件**被判为 "Invalid workflow file"：启动即失败、0 个 job，
# 在 Actions 列表里只留一个看起来"跑失败了"的红叉 —— 2026-08-13 到 09-21 本仓 CI 就是这样
# 静默失效了五周（Line 77/85: Unrecognized named-value: 'secrets'）。
# 需要按 secret 是否存在决定是否执行时：先绑到 job 级 env，再用 env.X 判断（见下方 build job）。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Types / Test / Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # turbo affected 需要完整 git 历史来计算变更集
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        # 版本取自根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo --affected 默认对比"当前分支与默认分支的 merge-base"。本仓直接 push main，
      # merge-base 就是 HEAD 自身 → 受影响集会算空、门禁静默跳过。
      # 显式给出 base/head（TURBO_SCM_BASE / TURBO_SCM_HEAD）才有可靠语义。
      # LINK https://turborepo.dev/docs/guides/skipping-tasks
      - name: Resolve affected base
        id: affected
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # 新分支 / force push 时 before 是全零
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "::warning::无法确定 affected 基准，本次按全量执行"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "TURBO_SCM_BASE=$base" >> "$GITHUB_ENV"
          echo "TURBO_SCM_HEAD=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Architecture boundaries (turbo boundaries)
        run: pnpm boundaries

      # 环是**没有任何其它闸看得见**的失效面：boundaries 只看包与 tag 的方向、
      # ESLint 分层只看单条边的方向（A→B 与 B→A 各自合法，两条同时在就是环）、tsc 不报环。
      # 成本实测 10.3s / 1050 个文件（2026-11-02），与同 job 的其它段并行不成瓶颈。
      - name: Circular dependency check (madge)
        run: pnpm madge:check

      # ── turbo 本地缓存（跨 run 持久化）──────────────────────────────────────────
      # 缓存路径是**整个 `.turbo/cache`** ⇒ 缓存的是「**这条 job 里 turbo 跑过的一切**」，
      # 而不是「哪几类任务」；范围由这条 job 跑什么决定。
      #
      # 这条 job 里跑的不止质量门：`Docs build` 也是 turbo 任务、产物 4.6 MB，**已用
      # `--cache-dir` 把它挡在外面**（见那一步）—— 否则归档会从几十 KB 涨到 MB 级、并随每次
      # docs 改动继续长。完整实测与取舍见 turbo-cache-boundary.md 第七节。
      #
      # **key 必须 rolling**（带 `github.sha` + `restore-keys` 前缀）：`actions/cache` 只在
      # key 不存在时保存 ⇒ 固定 key 会让缓存**冻在第一次写入那一版**，新条目永远进不去。
      # 换 key 时 `restore-keys` 的前缀要**一起换** —— 它是前缀匹配，只换 key 照样会拉回旧的。
      #
      # 安全性：turbo 缓存**按 task hash 校验** ⇒ 恢复到不匹配的条目只会 miss、不会误用；
      # 真正的守卫是 **hash 覆盖面**，由 `pnpm lint:turbo-cache` 的不变量盯着。
      - name: Restore turbo cache (quality gates)
        # v5 而不是 v4：v4 跑在 node20 上，而本仓已经在为 `actions/setup-node@v4` 收
        # 「Node.js 20 is deprecated」的告警 —— 别再添一个。
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-quality-v2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-quality-v2-

      - name: Lint (affected)
        run: pnpm exec turbo run lint --affected

      # 根级配置（eslint.config.ts / commitlint.config.ts / knip.config.ts）既不在任何包的
      # lint 范围里，也不进 turbo 的 affected 图 —— 必须显式跑，否则只有本地 pre-push 拦得住。
      - name: Lint root configs
        run: pnpm lint:root

      # 根 tsconfig（include: ["*.ts"]）覆盖 eslint.config.ts / commitlint.config.ts / knip.config.ts。
      # 它们同样不入 turbo 的图，且 lint 不做类型检查 —— 必须显式跑这条。
      - name: Type check root configs
        run: pnpm types:check:root

      - name: Type check (affected)
        run: pnpm exec turbo run types:check --affected

      - name: Tests (affected)
        run: pnpm exec turbo run test --affected

      # 文档站构建顺带做死链校验（VitePress 内置；`ignoreDeadLinks` 已从 true 收窄成
      # 「冻结语料 + 尚未编写的组件页」白名单）。跑在 CI 而不是 local pre-push：约 40s，
      # 且只对文档改动有意义。
      #
      # **给它自己的缓存目录**：这步是 turbo 任务、产物 4.6 MB，落进 `.turbo/cache` 会被
      # 上面那步整份上传（实测把归档从几十 KB 顶到 4.7 MB 起）。换目录后它**每次都真跑、
      # 不回放** —— 对一条「死链校验就是构建本身」的门禁来说，这正是想要的态度。
      #
      # 参数写法**实测过**，两种只差一个 `--`，行为完全不同：
      #   `pnpm run build:docs -- --cache-dir=x`  → 参数被 turbo 当**透传参数**给了任务本身
      #                                            （VitePress 收到 `--cache-dir=x`，缓存照旧写默认目录）
      #   `pnpm build:docs --cache-dir=x`         → 到 turbo（实测条目落进 `x`，默认目录未被写入）
      - name: Docs build (dead-link check)
        run: pnpm build:docs --cache-dir=.turbo/cache-docs

      # 拼出来的动态 import 说明符（模板插值 / 非字面量）在 tsc 与 vite build 里都不报错，
      # 只在运行期抛 Unknown variable dynamic import —— 2026-11 的 @walnut/ui 抽包就是这么
      # 让 Base:Switch（63 处使用）静默不渲染的。静态扫一遍即可发现。
      - name: Dynamic import specifier check
        run: pnpm lint:dynamic-imports

      # 补 VitePress 内置查不到的那一半：活文档**正文**里引用的 workspace 包名与仓库路径。
      # （内置只认 markdown 链接语法，反引号里的 `@walnut/xxx` / `packages/a/b.ts` 它看不见。）
      - name: Doc reference check
        run: pnpm lint:docs-refs

      # ADR 的形态（编号连续 / Status 在枚举内 / 四个必需小节 / index.md 双向对齐）没有任何
      # 现成工具管 —— 19 篇 ADR 曾有三种互不兼容的 Status 取值。见待办 F6。
      - name: ADR shape check
        run: pnpm lint:adr

      # 文档里标成 `ts` 的围栏块必须能按 TypeScript 解析：JSON 块不许标成 ts、不许截断/乱码。
      # 只做「零误报」的那一半（不要求文档块能编译 —— 实测那样会 100% 误报）。
      - name: Doc code-block check
        run: pnpm lint:doc-ts

      # 常驻上下文的几个文件（根 AGENTS.md / CLAUDE.md / 包级指引）不许无限膨胀；
      # 预算**用不到一半**同样失败（那种预算已经约束不到任何东西）。
      - name: Doc budget check
        run: pnpm lint:doc-budget

      # 注释里的 emoji 在非 UTF-8 代码页下必然乱码，也会污染 diff 与日志。ESLint 那条规则够不着
      # workflow / .gitignore / .toml / nginx .conf 这些文件，所以另有一条跨文件类型的门禁；
      # 常驻上下文文档走更严的一档（任意位置，不只注释）。
      - name: Emoji-in-comments check
        run: pnpm lint:emoji

      # 初始化数据（apps/server/db/seed）的形态。这份数据**随仓库发布、并被 `db:seed` 直接灌进库**，
      # 而它的失效方式全是静默的：真私钥/凭证被手工导进来、89MB 的行政区划进了 git 历史、
      # 未裁剪的账号被发布、引用坏了让侧边栏空掉且不报错。判据只看数据本身，不需要数据库。
      - name: Seed data shape check
        run: pnpm lint:seed

      # 手写的 `.d.ts` 关掉 `skipLibCheck` 查一遍（只报仓库内文件）。
      # `skipLibCheck: true` 跳过的是**全部** `.d.ts`，含我们自己写的那十几份 ⇒ 里面的错会静默
      # 退化成 any、症状跑到消费方去（2026-09-29 实测：16 处诊断 / 6 个文件，含两处 PWA 残留）。
      - name: Hand-written .d.ts check
        run: pnpm lint:dts

      # turbo 缓存边界：产物目录有没有进 outputs、依赖包源码有没有串进 types:check 的哈希……
      # 这类错误**不会报错**，只会让 turbo 报 FULL TURBO + exit 0 却少跑/少产出。
      - name: Turbo cache boundary check
        run: pnpm lint:turbo-cache

      # 「改 catalog 一行忘了 pnpm install」= 本地必然全绿、CI 必然死在 install
      # （`--frozen-lockfile`）。这是唯一看得见它的地方。
      - name: Catalog / lockfile lockstep check
        run: pnpm lint:lockfile

      # nginx 的 add_header 是「整段替换」：location 自己写一条就吃掉 server 级的 4 个安全头，
      # 并列的 server 块之间也不互相继承。本机没 Docker ⇒ 推送前只有这一段能看见它
      # （「头真的发出去了」由 deploy/post-verify.sh 在部署后核实）。
      - name: Entry nginx security headers check
        run: pnpm lint:nginx-headers

      # 源码里的凭据形状（PEM 私钥 / 带真口令的连接串 / JWT / 云厂商 AK）。
      # **它真正的位置是 prepush**：GitHub 的 push protection 在服务端、且先于 CI，
      # 被它拒掉时本地这段门禁是绿的（2026-09-23 实测）。CI 这一份是补第二道，
      # 覆盖"绕过钩子直接推"的情形。
      - name: Source secret-shape check
        run: pnpm lint:secrets

      # 共享包不构建就被消费（exports 指 ./src/**）⇒ exports 写错 = 解析到别的入口 / 类型静默丢失。
      - name: Package exports shape check
        run: pnpm lint:exports

      # 有生成物的包（admin 的两个 unplugin dts），它跑 vite / vue-tsc 的脚本必须都接了生成步骤。
      # 这条是 2026-09-24 那次事故的守卫：生成物移出跟踪面后漏了 `prebuild`，
      # 于是 `Build admin` 里 vite 的检查器在生成之前就读它 ⇒ 一串 `Cannot find name …`。
      - name: Script pre-hook check
        run: pnpm lint:pre-hooks

      # 防"affected 空集静默通过"：有文件变更却算出 0 个受影响包时必须失败
      - name: Affected set sanity check
        if: steps.affected.outputs.base != ''
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD" | wc -l)
          dry=$(pnpm exec turbo run lint --affected --dry=json 2>/dev/null | sed -n '/^{/,$p')
          pkgs=$(printf '%s' "$dry" | jq '.packages | length')
          {
            echo "## Affected 范围"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| base | \`${TURBO_SCM_BASE}\` |"
            echo "| head | \`${TURBO_SCM_HEAD}\` |"
            echo "| 变更文件数 | ${changed} |"
            echo "| 受影响包数 | ${pkgs} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$changed" -gt 0 ] && [ "$pkgs" -eq 0 ]; then
            echo "::error::有 ${changed} 个文件变更，但 affected 包数为 0（基准失效？）"
            exit 1
          fi

      - name: Dependency consistency (syncpack)
        run: pnpm syncpack:lint

      # 拦住「某个包的版本漂出 versioning.fixed 组」——在本 PR 上拦，而不是等到发版那天
      # 才发现 fixed 组锁步失败（那时 tag 与镜像已经在路上）。
      - name: Workspace version lockstep (pnpm change check)
        run: pnpm change check

  build:
    name: Build (server + shared packages, admin if secrets available)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # secrets 上下文不能出现在 if 里 → 先绑到 env，再用 env 判断（本文件顶部注释）
      DOTENVX_KEYS: ${{ secrets.ENV_KEYS }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 编译不需要环境变量：SWC 只做语法转换，运行时才读取 env
      - name: Build server + shared packages
        run: pnpm exec turbo run build --filter=@walnut/server...

      # admin 构建需要 VITE_* 环境变量（zod 校验 fail-fast）。env-encrypted/ 已随仓库提交，
      # 私钥在仓库 Secrets（ENV_KEYS = .env.keys 全文）里。fork PR 没有 secrets → 跳过。
      - name: Decrypt environment files
        if: env.DOTENVX_KEYS != ''
        uses: ./.github/actions/decrypt-env
        with:
          keys: ${{ env.DOTENVX_KEYS }}

      # `--force` 是**刻意**的：忽略 turbo 缓存、真的跑一次构建。
      #
      # 为什么必须在 CI 里强制一次（2026-09-30 实测）：v0.1.4 的发版死在 `Build admin` 上
      # （`types/generated/components.d.ts` 被读到半写内容 ⇒ `TS1434 / TS1128`），而**同一个提交的
      # CI 是绿的** —— 因为 CI 命中了 turbo 缓存、压根没真构建。也就是说：CI 的绿有可能是缓存给的，
      # 而发版是 cache miss ⇒ 真构建 ⇒ 才暴露。"构建产物对不对"这件事必须由**无缓存**的那次来担保，
      # 否则这类 bug 永远只能在发版时付代价（一次发版 + 一轮排查）。
      #
      # 代价：这一步不再吃缓存（约 1~2 分钟）；换来的是 CI 与发版在"构建"这件事上**同源**。
      # 这条约束由 `src/ci/__tests__/ci-workflow.test.ts` 机械钉住 —— 别把它改回去。
      - name: Build admin
        if: env.DOTENVX_KEYS != ''
        run: pnpm exec turbo run build --filter=@walnut/admin --force

      # 构建成功不等于跑得起来（留档 V13）：那次 `resolve.conditions` 少了默认条件，产物一执行就抛
      # `Cannot destructure property '__extends' …`、页面停在 splash —— 而 tsc / lint / build /
      # dist 密钥扫描**全绿**。所以构建完立刻用真实浏览器打开一次：断言 `#app` 里的 splash 消失
      # （= mount 真的执行了）。runner 自带 google-chrome；没浏览器时脚本会明确 SKIP 而不是假绿。
      - name: Smoke test the built admin bundle
        if: env.DOTENVX_KEYS != ''
        run: pnpm smoke:dist

      # 前端产物是**公开文件**，而"把后端 env 泄进前端"在本仓有现成的静默路径：
      # apps/server/env-local 与 apps/admin/env-local 是两套 env，搬错一行就会被打包进去，
      # 而构建 / 类型 / lint / 测试全都不会响。**必须紧跟构建**：它扫的就是 dist。
      # 规则表与「为什么只有这几条」写在 check-dist-secrets.ts 顶部（都是在真产物上试出来的）。
      - name: Dist secret scan
        if: env.DOTENVX_KEYS != ''
        run: pnpm lint:dist

      - name: Note skipped admin build
        if: env.DOTENVX_KEYS == ''
        run: echo "::notice::未配置 ENV_KEYS secret，跳过 admin 构建（镜像构建由 tag 发布流程负责）"

  # ---------- OpenAPI 一致性（export → generate → git diff，**两段**）----------
  # 之前只有 pre-push 的 openapi 段守着「路由/装饰器改动没重新 export」；CI 里没有，
  # 绕过钩子直接推就会把漂移带进 main。这里把它变成独立 job，与 quality / build 并列。
  #
  # 2026-11 批次 4 · D9 起这里跑两段，而不是一整条：
  #   段①  导出 openapi.json —— 必须引导 AppModule（PG/Redis 在线 + env 解密）
  #   段②  openapi.json → schema.d.ts —— 不引导 AppModule、不碰数据库，pure 文件变换
  # 拆段的唯一理由是触发面：fork PR 拿不到 secret ENV_KEYS ⇒ 段① 跑不了，
  # 但段② 没有这个前提，于是「没有 key」的分支改为硬跑段②（下面两步的 if 分别覆盖两侧）。
  # 别把两步合并回一条 `pnpm openapi:check`：那等于把贡献者路径上的那道闸重新拆掉。
  #
  # openapi:export 会以**完整 AppModule** 引导（连 PG / Redis），但 schema 来自路由与装饰器
  # 元数据 —— 本地用「空库 + 只建运行时角色」实测可正常写出 212 个 schema，不需要 seed、也不需要
  # 表数据。唯一的前提是运行时角色 `walnut_app`（DATABASE_PG_APP_USER，NOSUPERUSER NOBYPASSRLS）
  # 必须存在：它由迁移 `1793360000000-DataScopePhase3Rls` 创建，而 service 容器是全新 cluster。
  # 因此这里先跑一次迁移（顺带建表，future-proof），不跑 seed。
  openapi:
    name: OpenAPI drift (export + generate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # secrets 上下文不能出现在 if 里 → 先绑到 env，再用 env 判断（见文件顶部注释）
      DOTENVX_KEYS: ${{ secrets.ENV_KEYS }}
    services:
      # 连接参数对齐 apps/server/env-encrypted/.env.development 解密后的值（127.0.0.1:5432 /
      # 127.0.0.1:6379、用户名/库名），这里只是 CI 一次性实例，不承载任何真实数据。
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: walnut
          POSTGRES_PASSWORD: '123456'
          POSTGRES_DB: walnut_pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U walnut -d walnut_pg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        # 官方 redis 镜像没有密码 env：用 service container 的 `command`（覆盖镜像 CMD）
        # 传 --requirepass；密码对齐解密后的 APP_REDIS_PASS（CI 一次性实例，不是生产凭据）。
        # GitHub 自 2026-04 起支持 service 的 `command` / `entrypoint`；若本地或 CI 的
        # actionlint 版本滞后、报 `unexpected key "command"`，升级 actionlint，别改回无密码。
        command: redis-server --requirepass 123456
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a 123456 ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # openapi:export 运行时 require("@walnut/contract") 与（U3 起）"@walnut/utils/object-paths"
      # —— 两个 workspace 包的 dist 不进 git、install 也不生成，必须显式构建
      # （build job 由 turbo 的 dependsOn ^build 顺带做了，这里单独点名这两个）。
      - name: Build workspace runtime deps (contract / utils)
        run: pnpm exec turbo run build --filter=@walnut/contract --filter=@walnut/utils

      # openapi:export 读 apps/server/env-local/.env.development（ConfigModule 定位），
      # 与 ci.yml 的 build job 同一条解密通道；fork PR 没有 secrets → 跳过整段。
      - name: Decrypt environment files
        if: env.DOTENVX_KEYS != ''
        uses: ./.github/actions/decrypt-env
        with:
          keys: ${{ env.DOTENVX_KEYS }}

      - name: Apply migrations (fresh PG service)
        if: env.DOTENVX_KEYS != ''
        working-directory: apps/server
        run: pnpm migration:run

      # 段②（openapi.json → schema.d.ts）**不需要引导 AppModule、不需要数据库**，
      # 所以它必须在**没有** ENV_KEYS 的分支里也硬跑：fork PR 拿不到仓库 secret，
      # 而贡献者恰恰是最容易改到 server DTO（进而需要重生成 schema）的那批人。
      # 2026-11 批次 4 · D9 之前这里是「没有 key 就整段跳过」⇒ 那道闸在贡献者路径上缺位。
      - name: OpenAPI schema drift check (segment ② — no secrets needed)
        if: env.DOTENVX_KEYS == ''
        working-directory: apps/server
        run: pnpm openapi:check:schema

      # 段① + 段② 全量：段① 要引导完整 AppModule（PG / Redis service 已在本 job 起好）。
      - name: OpenAPI drift check (segment ① + ②)
        if: env.DOTENVX_KEYS != ''
        working-directory: apps/server
        run: pnpm openapi:check

      # worker 生产面冒烟（batch-3 r2）。为什么必须在这里：worker 的失败是**静默的** ——
      # cron 没挂上时 api 照常 200、/health/ready 照过，部署脚本与 post-verify 都看不见。
      # 唯一现成的探针是 apps/worker/src/main.ts:34 那行 `cron jobs: N`，不用改代码。
      #
      # 四个坑（2026-11 实测，见 reports/batch-3/r1-verification.md §2.3）：
      #   ① NODE_ENV 必须是 development：production 下 libs/config/src/utils/pg-app-password.ts:45 的
      #      守卫会因「开发引导密码」直接拒绝启动（与 openapi:export 同口径，这也是本步只用 dev 的原因）；
      #   ② 只有本 job 同时有 PG / Redis service + 已迁移的库（quality / build 都没有 services）；
      #   ③ 进程**不会自己退出**（实测 40s 仍在跑）⇒ 断言命中后 SIGTERM + wait，
      #      靠 apps/worker/src/main.ts:26 的 enableShutdownHooks 优雅收场；
      #   ④ 冷 require 整张依赖图要 ~9s（实测 9.1 / 9.3s，Nest 自身只占 ~1s）⇒ 轮询 40 × 1s 兜底，
      #      **不要**写成固定 sleep 3（那样在 ubuntu runner 上会随机红）。
      #
      # WALNUT_ADMIN_BOOTSTRAP_TASKS=off：否则 worker 启动即跑 6 个 bootstrap 任务（含 rotateAppKey），
      # CI 里纯属副作用；它只隔离 bootstrap、不影响 cron 注册（ADR 0025），所以计数断言依旧有效。
      - name: Worker smoke (cron registered)
        if: env.DOTENVX_KEYS != ''
        working-directory: apps/server
        run: |
          set -euo pipefail
          # 用**产出镜像 dist 的同一条命令**（nest build api + verify-build-assets）：
          # 断言的是「生产构建出的 dist 里 worker 能跑」，而不只是「某次构建曾留下过入口文件」。
          pnpm build
          log="$(mktemp)"
          start=$(date +%s)
          NODE_ENV=development WORKER_STANDALONE=true WALNUT_ADMIN_BOOTSTRAP_TASKS=off \
            node dist/apps/worker/src/main.js >"$log" 2>&1 &
          pid=$!
          # 轮询而不是 sleep：命中即走；进程提前死掉（配置错误 / 连不上库）也立刻退出循环
          for _ in $(seq 1 40); do
            if grep -qE 'cron jobs: [1-9][0-9]*' "$log"; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "waited $(( $(date +%s) - start ))s for the worker to register cron jobs"
          tail -n 5 "$log"
          # 断言：grep 不到 ⇒ exit 1 ⇒ 本步红。注意 `cron jobs: 0` 也必须红 ——
          # 「进程起来了但一个 cron 都没挂上」正是要抓的缺陷形态，不能放过。
          grep -E 'cron jobs: [1-9][0-9]*' "$log"

      # 这条 note 现在只说「哪一半没跑」：段② 已在上面的 `DOTENVX_KEYS == ''` 分支里真跑过，
      # 别再写成「跳过 OpenAPI 一致性校验」—— 那会让 fork PR 的日志读起来像整段都没守。
      - name: Note skipped OpenAPI segment ①
        if: env.DOTENVX_KEYS == ''
        run: echo "::notice::未配置 ENV_KEYS secret，只跑了 OpenAPI 段②（openapi.json → schema.d.ts）；段①（重导出 openapi.json）需要有 PG/Redis 与解密后的 env，fork PR 上跳过"
