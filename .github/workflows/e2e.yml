name: E2E (nightly)

# 全链路 E2E 的定时工作流（`apps/e2e`）：**只在 nightly 与手动 dispatch 跑，不进 PR**。
#
# 为什么不进 PR（计划页 §2.8 的口径，ADR 0009 的分层）：
# - PR 的 quality 门禁已经约半小时，再叠 install / 两次 stage 构建 / 浏览器安装会把反馈时间推得不可接受；
# - fork PR 拿不到 ENV_KEYS secret（没有解密后的 stage env 就构建不出 admin 产物）；
# - 全量 E2E 的职责是「长尾 + 真实链路」的周期性证据，不是合并阻塞项。
#
# 三条**硬约束**（踩过或差点踩过的坑）：
# 1. **secrets 不写进 step/job 的 `if`**：该位置不暴露 secrets 上下文，整个文件会被判
#    "Invalid workflow file" —— 启动即失败、0 个 job（2026-08-13 到 09-21 本仓 CI 就这样静默失效过五周）。
#    这里绑到 job 级 `env`，step 里用 `env` 的 shell 变量判断（见 Decrypt environment 一步）。
# 2. **浏览器不缓存**：`playwright install --with-deps chromium` 每次装。缓存坏了导致假红的排查成本
#    高于下载时间（计划页 P0-1 改法第 6 条）。
# 3. **concurrency 固定 group、不取消在途**：同一时间只允许一份 e2e（与本地「一台机器一个全量 run」
#    同一语义）；nightly 与手动 dispatch 撞车时排队，不互相杀。
#
# **artifact 严格口径**（所有者 2026-11-25 拍板）：只上传 junit / json / 脱敏后端日志 / stack.json /
# 基线清单五样。trace、截图、HTML 报告含请求头与响应体（token、cookie）——**一律不上传**，
# 这是 `apps/e2e/AGENTS.md` 不变量 8 的直接落地，不改口径。
#
# **基线（baseline）跨 run 缓存，CI 走基线路径**（所有者 2026-11-26 批准切回；seal 一次、restore 每轮）：
# - 封板三件套（baseline.dump / baseline.manifest.json / baseline.credentials.json）由 `actions/cache`
#   跨 run 缓存。key = `e2e-baseline-v<清单格式版本>-<dataKey>`：dataKey 变（seed / 迁移 / 数据工具改）
#   必然 miss，旧基线也不该被恢复（restore 会因 dataKey 不符拒收）。**只做精确 key，不做
#   `dataKey-` 前缀兜底**：不匹配的基线只会白占配额。
# - 缓存未命中（首跑必为 miss）⇒ `ensureTestDatabase` 的全量 prepare + seal 兜底路径自动工作；
#   job 成功后 `actions/cache` 的 post 步骤自动保存这一份，下一轮起走 restore。
# - 执行层是可移植的（P1-1，apps/e2e/scripts/pg-container.ts）：`E2E_PG_CONTAINER` 未设时，
#   `CI=true` 且非 WSL 投递会按镜像 `postgres:18-alpine` 解析 service 容器（与下面给 Redis 设口令
#   那一步同一手法 —— runner 生成的容器名不可预知）；Linux runner 直接 `docker exec`（不经 WSL）；
#   `pg_dump` / `pg_restore` 在 postgres 官方镜像里自带，端口 / 库名 / 凭据与 `apps/e2e/scripts/env.ts` 同源。
# - **回退**：若 restore 路径在 GitHub 上首跑意外红，在 `Run full e2e` 一步加回
#   `E2E_SKIP_BASELINE: '1'`（退回每轮全量 prepare、不封板），按红日志修完再删掉这一行。
#   同一个回退动作也写在 apps/e2e/README.md 的「CI 形态（nightly）」一节。

on:
  schedule:
    # UTC 19:00 ≈ 北京时间 03:00（避开北京白天的高峰与发版窗口）
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  # 排队而不是取消在途：一轮全量跑了一半被取消，留下的设备行 / Redis 键会污染下一次读数
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Full e2e (protocol + UI)
    runs-on: ubuntu-latest
    # 全量实测 3–4 分钟；留足 install / 两次 stage 构建 / webServer 180s 与浏览器安装的余量。
    # 必须明显大于 Playwright 的 globalTimeout 与 webServer timeout。
    timeout-minutes: 60
    env:
      # secrets 上下文不能出现在 `if` 里 → 绑到 job 级 env，在 step 的 shell 里判断（见文件头硬约束 1）
      ENV_KEYS: ${{ secrets.ENV_KEYS }}
    services:
      # 独立数据栈：端口 / 库名 / 凭据必须与 `apps/e2e/scripts/env.ts` **逐字一致**（那是唯一真源，
      # 两份 compose 也照它对齐）。这些是本机测试栈的固定明文，不是 secret。
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: walnut
          POSTGRES_PASSWORD: e2e_dev_only
          POSTGRES_DB: walnut_e2e
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U walnut -d walnut_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - '6380:6379'
        # 口令由下面的 "Set redis password" 一步经 `CONFIG SET` 设上：**services 不支持
        # `command:`**（GitHub 只认 image / env / ports / volumes / options，actionlint 会直接判
        # 非法），而官方 redis 镜像没有「用环境变量设密码」的入口。健康检查写成 `|| redis-cli ping`
        # 兜底：设密码之前第一条因 AUTH 报错、第二条证明可达；设完之后第一条（带正确口令）通过。
        options: >-
          --health-cmd "redis-cli -a e2e_redis_only ping || redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          # 产物新鲜度（scripts/freshness.ts）读 `git log -1`，基线漂移判定读 HEAD —— 都要完整历史
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        # 版本取自根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 解密 env-encrypted/ → env-local/：admin 构建的 VITE_*（zod 校验 fail-fast）与后端 stage
      # 的根密钥（OPAQUE / cookie / JWT）都只能来自这里。密钥用完立即删除（与 composite action
      # `.github/actions/decrypt-env` 同口径，只是本 workflow 不需要跳过分支）。
      - name: Decrypt environment files
        run: |
          set -euo pipefail
          if [ -z "${ENV_KEYS}" ]; then
            echo "::error::缺少 ENV_KEYS secret —— E2E 需要 apps/server/env-local/.env.stage 与 admin 构建的 VITE_*"
            exit 1
          fi
          printf '%s\n' "$ENV_KEYS" > .env.keys
          pnpm setup-env
          rm -f .env.keys
          echo "env-local 解密完成：admin $(ls apps/admin/env-local | wc -l) 项、server $(ls apps/server/env-local | wc -l) 项"

      # `@walnut/utils` / `@walnut/contract` 的 CJS dist 是 E2E 的硬前置（sign-raw / contract bridge
      # 走 require）。先全量构建，再产出两处 stage 产物 —— 顺序即依赖。
      - name: Build workspace packages and apps
        run: pnpm build

      - name: Build admin stage bundle
        run: pnpm walnut build:stage

      - name: Build server stage bundle
        run: pnpm --filter @walnut/server build:stage

      - name: Install Playwright chromium
        run: pnpm --filter @walnut/e2e exec playwright install --with-deps chromium

      # services 不支持 `command:`（见上面 redis 服务里的注释），所以口令在容器起来之后用
      # `CONFIG SET` 设上 —— 值必须与 `apps/e2e/scripts/env.ts` 的 `E2E_REDIS_PASS` 逐字一致。
      # 容器名由 runner 生成、不可预知：按镜像名找它（本 job 里只有这一个 redis:8-alpine）。
      - name: Set redis password
        run: |
          set -euo pipefail
          container="$(docker ps -q --filter ancestor=redis:8-alpine | head -n1)"
          if [ -z "$container" ]; then
            echo "::error::找不到 Redis service 容器（redis:8-alpine）"
            exit 1
          fi
          docker exec "$container" redis-cli CONFIG SET requirepass e2e_redis_only

      # 基线缓存的键：stdout 只有 `v<MANIFEST_VERSION>-<dataKey>`（见 apps/e2e/scripts/data-key.ts）。
      # dataKey 是 HEAD 上「决定测试库内容」的路径组合树哈希 —— 同一提交在 CI 与本地算出的值
      # 一致（checkout 是 fetch-depth: 0，无浅克隆）；清单格式版本并进键里，升级即自然失效。
      # 必须放在 `pnpm build` 之后：data-key.ts 经 env.ts 依赖 `@walnut/contract` 的 CJS 产物。
      - name: Compute baseline cache key
        id: baseline-key
        run: echo "key=$(node apps/e2e/scripts/data-key.ts --cache-key)" >> "$GITHUB_OUTPUT"

      # 只缓存封板三件套，不缓存 `.e2e/` 整目录（里面还有排障残渣）。命中 ⇒ 下一轮 run 走
      # restore；未命中 ⇒ 全量 prepare + seal，job 成功后本 action 的 post 步骤自动保存。
      # 注意：恢复出来的清单仍会被 baseline.ts 逐项校验（dataKey / dump 与 credentials 的 sha），
      # 缓存只是加速，不是信任来源。v5 而不是 v4：与 ci.yml 同口径（v4 跑在 node20 上）。
      # 这里**不用** rolling key / restore-keys：缓存内容由 `dataKey` 唯一决定，同一 key 下的
      # 基线是内容不变的，没有「冻在第一次写入」的问题。
      - name: Restore baseline cache
        id: baseline-cache
        uses: actions/cache@v5
        with:
          path: |
            apps/e2e/.e2e/baseline.dump
            apps/e2e/.e2e/baseline.manifest.json
            apps/e2e/.e2e/baseline.credentials.json
          key: e2e-baseline-${{ steps.baseline-key.outputs.key }}

      # 全量（含 @network：真实外网定位）。有缓存 ⇒ restore；没有（首跑 / dataKey 变）⇒
      # 全量 prepare + seal 兜底。**回退口径见文件头**：restore 首跑意外红时加回
      # `E2E_SKIP_BASELINE: '1'`。
      - name: Run full e2e
        run: pnpm walnut e2e

      # 兜底脱敏：主路径已在 scripts/start-backend.ts 的写入处脱敏；这里防「包装脚本没跑成 /
      # 文件被别的路径写脏」。artifact 一旦上传就不可收回，多跑一遍是毫秒级成本。
      - name: Redact backend log (defense in depth)
        if: always()
        run: node apps/e2e/scripts/redact-log.ts apps/e2e/test-results/backend.log

      # **严格口径**：只这五样。trace / 截图 / HTML 报告一律不上传（不变量 8）。
      # `include-hidden-files` 是为 `.e2e/`（点目录）里的 stack.json 与基线清单 —— 默认会跳过。
      - name: Upload diagnostics (strict allow-list)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            apps/e2e/test-results/junit.xml
            apps/e2e/test-results/results.json
            apps/e2e/test-results/backend.log
            apps/e2e/.e2e/stack.json
            apps/e2e/.e2e/baseline.manifest.json
