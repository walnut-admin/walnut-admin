name: Deploy

# 纯部署：只拉取已发布的镜像并滚动重启，不构建任何东西（历史上 build+deploy 耦合，
# 每次上线都要重建三个镜像，实测 85 分钟；现在部署本身是分钟级）。
#
# 两种用法：
# 1) 被 release.yml 复用（workflow_call）：tag 发布成功后自动部署该 tag
# 2) 手动 workflow_dispatch：**回滚/重发**用 —— image_tag 填上一个发布 tag（如 v0.9.0）

on:
  workflow_call:
    inputs:
      image_tag:
        description: 要部署的镜像 tag（发布 tag，如 v0.10.0）
        required: true
        type: string
      environment:
        description: 目标环境
        required: false
        type: string
        default: prod
      # 参考数据注入：**默认关闭**。默认语义（mongoimport --mode=upsert）是整文档替换，会把运维在
      # 后台改过的菜单/设置覆盖回去；所以这里走 `--mode=insert`（只插不改，等价于 `db:seed --if-missing`），
      # 且只在**显式勾选**时跑 —— 首次部署（空库）用一次，之后不该再跑。
      seed_reference_data:
        description: 是否把参考数据（菜单/字典/语言包/应用设置）注入到线上库（只插不改）
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: 要部署的镜像 tag（回滚时填上一个发布 tag，如 v0.9.0）
        required: true
        type: string
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - prod
      seed_reference_data:
        description: 是否注入参考数据（只插不改；首次部署/空库时勾）
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NS: tron1997

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.image_tag }}
      DOTENVX_KEYS: ${{ secrets.ENV_KEYS }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm install 只为 pnpm setup-env（@walnut/scripts 的 dotenvx bin）服务，约 30s（store 有缓存）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decrypt environment files
        uses: ./.github/actions/decrypt-env
        with:
          keys: ${{ env.DOTENVX_KEYS }}

      # 回滚时最容易犯的错是把 tag 写错：先确认三个镜像都真实存在，再动服务器
      - name: Verify images exist in TCR
        run: |
          set -euo pipefail
          echo "${{ secrets.TCR_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.TCR_USERNAME }}" --password-stdin
          for img in nginx backend frontend; do
            if ! docker buildx imagetools inspect "$REGISTRY/$IMAGE_NS/$img:$TAG" > /dev/null 2>&1; then
              echo "::error::镜像不存在：$REGISTRY/$IMAGE_NS/$img:$TAG（tag 写错了？）"
              exit 1
            fi
          done
          echo "三个镜像均存在：$TAG"

      # 生成服务器 env 文件：连接串改服务名 + 从解密产物提取数据层密码拼装 .env
      - name: Generate server env files
        run: |
          set -euo pipefail
          sed -i \
            -e 's|^APP_REDIS_HOST=.*|APP_REDIS_HOST=prod-single-redis|' \
            -e 's|^DATABASE_PRIMARY=.*|DATABASE_PRIMARY=prod-mongodb-primary:27017|' \
            -e 's|^DATABASE_SECONDARY=.*|DATABASE_SECONDARY=prod-mongodb-secondary:27017|' \
            -e 's|^DATABASE_ARBITER=.*|DATABASE_ARBITER=prod-mongodb-arbiter:27017|' \
            apps/server/env-local/.env.production
          DB_PASS=$(grep '^DATABASE_PASS=' apps/server/env-local/.env.production | cut -d= -f2- | tr -d '"')
          REDIS_PASS=$(grep '^APP_REDIS_PASS=' apps/server/env-local/.env.production | cut -d= -f2- | tr -d '"')
          test -n "$DB_PASS" || { echo "ERROR: DATABASE_PASS not found"; exit 1; }
          test -n "$REDIS_PASS" || { echo "ERROR: APP_REDIS_PASS not found"; exit 1; }
          mkdir -p deploy-files
          cp apps/server/env-local/.env.production deploy-files/.env.production
          # 部署后验证脚本一起上传，部署完在服务器上跑（见下方 Post-deploy verification）
          cp deploy/post-verify.sh deploy-files/post-verify.sh
          cat > deploy-files/.env <<EOF
          IMG_TAG=${TAG}
          MONGODB_ROOT_PASSWORD=${DB_PASS}
          MONGODB_REPLICA_SET_KEY=WalnutAdminNestjsMongoDBReplicasetProdName
          MONGODB_REPLICA_SET_NAME=WalnutAdminNestjsMongoDBReplicasetProdName
          REDIS_PASSWORD=${REDIS_PASS}
          EOF
          echo "deploy-files 生成完成（IMG_TAG=${TAG}）"

      - name: Upload env files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          source: "deploy-files/"
          target: /home/ubuntu/walnut-admin/deploy/

      # 证据链：部署前后各打印一次容器→镜像映射，避免"4 秒就成功"这种无法自证的部署
      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          script: |
            set -e
            cd /home/ubuntu/walnut-admin/deploy

            # ---- 写入 CI 生成的环境文件 ----
            mv -f deploy-files/.env .env
            mv -f deploy-files/.env.production env/.env.production
            # 验证脚本留在部署目录，供下一步调用（deploy-files 其余内容清掉）
            mv -f deploy-files/post-verify.sh post-verify.sh
            rm -rf deploy-files
            # 只替换 IMG_TAG 行，保留服务器上的人工配置（如有）
            if grep -q '^IMG_TAG=' .env; then
              sed -i "s/^IMG_TAG=.*/IMG_TAG=${{ env.TAG }}/" .env
            else
              echo "IMG_TAG=${{ env.TAG }}" >> .env
            fi

            echo "=== 部署前 ==="
            docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}' || true

            # 服务器端登录 TCR：runner 上的 docker login 不作用于服务器
            echo "${{ secrets.TCR_PASSWORD }}" | docker login ccr.ccs.tencentyun.com -u "${{ secrets.TCR_USERNAME }}" --password-stdin

            docker compose pull

            # compose >= 2.17 支持 --wait：等 healthcheck 通过再返回，避免"起来就成功"的假绿
            if docker compose version --short | awk -F. '{ exit !($2 >= 17) }'; then
              docker compose up -d --wait --wait-timeout 180
            else
              docker compose up -d
            fi

            echo "=== 部署后 ==="
            docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
            docker inspect --format '{{.Name}} → {{.Config.Image}}' walnut-nginx walnut-frontend walnut-backend

            docker image prune -f --filter "until=72h"

            # ---- 健康检查：经 nginx 容器访问前端（--resolve 指到本机，绕过公网/CDN）----
            command -v curl >/dev/null || { echo "ERROR: 服务器缺少 curl，无法健康检查"; exit 1; }
            code=$(curl -sk -o /dev/null -w '%{http_code}' --resolve www.walnut-admin.com:443:127.0.0.1 https://www.walnut-admin.com/ -m 10 || true)
            test "$code" = "200" -o "$code" = "301" -o "$code" = "302" || { echo "ERROR: 部署后健康检查失败（HTTP $code）"; exit 1; }
            echo "部署成功：IMG_TAG=${{ env.TAG }}，健康检查 HTTP $code"

      # 部署后验证（post-verify）：上一步只保证"容器起来了 + healthcheck 过"，
      # 这一步持续观察 2 分钟，证明服务真的在工作：镜像 tag 正确、后端出现启动标记、
      # 后端日志无致命错误、前端/入口 nginx 无 5xx、公网域名端到端 200。详见 deploy/post-verify.sh
      - name: Post-deploy verification
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/walnut-admin/deploy
            bash post-verify.sh 24 5

      # 参考数据注入（只有勾了 seed_reference_data 才跑）。
      #
      # 判据刻意**不依赖重复键语义**：`mongoimport` 的 `--stopOnError` 行为在版本间含糊（默认是继续
      # 还是中止、重复键会不会中断整批，官方文档与历史 issue 都不一致），而这条路径在生产上没法
      # 先试错。所以改成**按集合判**：
      #   · 集合为空  -> `--mode=insert` 整集插入（空集合不可能撞重复键，语义确定）；
      #   · 集合非空  -> **整集跳过**，不碰运维在后台改过的任何一条。
      # 副作用是明说的：后续版本往已有集合里**新增**的行不会被这条路径带上去 —— 那类增量走通道 1
      # （`pnpm db:export` 出差异 → PR 审 → 随发版走），或运维显式跑一次 `db:seed`。
      #
      # 为什么把文件 `docker cp` 进容器：`mongoimport` 跑在 mongo 容器里、看不到宿主路径；
      # 凭据用**容器自己的环境变量**（Bitnami 注入的 root 账号），不落到命令行上 —— 命令行会进
      # CI 日志与服务器进程表。
      - name: Download seed asset from the release
        if: inputs.seed_reference_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p seed-asset
          gh release download "${{ env.TAG }}" --pattern 'walnut-admin-seed-*.tar.gz' --dir seed-asset
          ls -l seed-asset

      - name: Upload seed asset to server
        if: inputs.seed_reference_data
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          source: "seed-asset/"
          target: /home/ubuntu/walnut-admin/deploy/

      - name: Seed reference data on server
        if: inputs.seed_reference_data
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/walnut-admin/deploy

            # 目标库名取自后端自己那份 env（别写死：它由 CI 从 env-encrypted 生成）
            DB_NAME=$(grep -E '^DATABASE_NAME=' env/.env.production | head -1 | cut -d= -f2-)
            test -n "$DB_NAME" || { echo "ERROR: env/.env.production 里没有 DATABASE_NAME"; exit 1; }
            echo "目标库：$DB_NAME"

            rm -rf seed-staging && mkdir -p seed-staging
            tar xzf seed-asset/walnut-admin-seed-*.tar.gz -C seed-staging
            test -d seed-staging/seed || { echo "ERROR: 资产里没有 seed/ 目录"; exit 1; }

            # 参考数据都在主节点上操作（副本集会自动同步到从节点）
            CID=$(docker compose ps -q prod-mongodb-primary)
            test -n "$CID" || { echo "ERROR: 找不到 prod-mongodb-primary 容器"; exit 1; }
            docker cp seed-staging/seed/. "$CID":/tmp/seed-ref

            # 容器内执行：凭据取自容器自身的环境变量（Bitnami 注入），不回显、不进命令行
            in_mongo() {
              docker compose exec -T prod-mongodb-primary sh -c "
                mongosh --quiet \
                  --username \"\$MONGODB_ROOT_USER\" --password \"\$MONGODB_ROOT_PASSWORD\" \
                  --authenticationDatabase admin '$DB_NAME' --eval \"$1\"
              "
            }

            echo "=== 逐集合注入（空则插、非空则跳过）==="
            for f in seed-staging/seed/*.json; do
              col=$(basename "$f" .json)
              existing=$(in_mongo "db.getCollection('$col').countDocuments()" | tr -d '[:space:]')
              if [ "${existing:-0}" != "0" ]; then
                echo "  skip   $col（库里已有 ${existing} 条：不覆盖运维数据）"
                continue
              fi
              docker compose exec -T prod-mongodb-primary sh -c "
                mongoimport \
                  --username \"\$MONGODB_ROOT_USER\" --password \"\$MONGODB_ROOT_PASSWORD\" \
                  --authenticationDatabase admin \
                  --db '$DB_NAME' --collection '$col' \
                  --file '/tmp/seed-ref/$(basename "$f")' \
                  --jsonArray --mode=insert 2>&1 | tail -2
              "
            done

            echo "=== 注入后条数（这就是可复核的证据）==="
            in_mongo 'db.getCollectionNames().sort().forEach(c => print("  " + c.padEnd(18) + db.getCollection(c).countDocuments()))'

            rm -rf seed-staging seed-asset
            echo "参考数据注入完成：空集合已补齐，非空集合一个文档都没动"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 部署结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 环境 | ${INPUT_ENV} |"
            echo "| IMG_TAG | \`${TAG}\` |"
            echo "| 部署步骤 | 见 Deploy on server |"
            echo "| 部署后验证 | 见 Post-deploy verification（失败即整个 job 失败） |"
            echo "| 结果 | ${{ job.status }} |"
            echo ""
            echo "> 验证脚本：[deploy/post-verify.sh](https://github.com/walnut-admin/walnut-admin/blob/main/deploy/post-verify.sh)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUT_ENV: ${{ inputs.environment }}
