name: Deploy Docker Images to Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - prod

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NS: walnut-admin
  TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 前端构建输入：.env.keys 解密 env-encrypted → env-local
      # heredoc 保留引号/注释行原样（${{ }} 在 run 执行前已由 Actions 渲染，不受 heredoc 影响）
      - name: Prepare env (.env.keys → setup-env)
        run: |
          cat > .env.keys <<'EOF'
          ${{ secrets.ENV_KEYS }}
          EOF
          pnpm setup-env
        # 注意：secrets 会被 Actions 自动打码，日志安全

      - name: Login to Tencent TCR
        run: echo "${{ secrets.TCR_PASSWORD }}" | docker login $REGISTRY -u "${{ secrets.TCR_USERNAME }}" --password-stdin

      - name: Build & push backend
        run: |
          docker build -f apps/server/Dockerfile -t $REGISTRY/$IMAGE_NS/backend:$TAG .
          docker push $REGISTRY/$IMAGE_NS/backend:$TAG

      # nginx 必须先于 frontend 构建：frontend Dockerfile 的
      # FROM walnut-admin/nginx-brotli:latest 依赖本机刚构建的 nginx 镜像
      - name: Build & push nginx
        run: |
          docker build -f deploy/nginx/Dockerfile -t $REGISTRY/$IMAGE_NS/nginx:$TAG .
          docker tag $REGISTRY/$IMAGE_NS/nginx:$TAG walnut-admin/nginx-brotli:latest
          docker push $REGISTRY/$IMAGE_NS/nginx:$TAG

      - name: Build & push frontend
        run: |
          docker build -f apps/admin/Dockerfile -t $REGISTRY/$IMAGE_NS/frontend:$TAG .
          docker push $REGISTRY/$IMAGE_NS/frontend:$TAG

      # 生成服务器 env 文件：连接串改服务名 + 从解密产物提取数据层密码拼装 .env
      - name: Generate server env files
        run: |
          sed -i \
            -e 's|^APP_REDIS_HOST=.*|APP_REDIS_HOST=prod-single-redis|' \
            -e 's|^DATABASE_PRIMARY=.*|DATABASE_PRIMARY=prod-mongodb-primary:27017|' \
            -e 's|^DATABASE_SECONDARY=.*|DATABASE_SECONDARY=prod-mongodb-secondary:27017|' \
            -e 's|^DATABASE_ARBITER=.*|DATABASE_ARBITER=prod-mongodb-arbiter:27017|' \
            apps/server/env-local/.env.production
          DB_PASS=$(grep '^DATABASE_PASS=' apps/server/env-local/.env.production | cut -d= -f2- | tr -d '"')
          REDIS_PASS=$(grep '^APP_REDIS_PASS=' apps/server/env-local/.env.production | cut -d= -f2- | tr -d '"')
          test -n "$DB_PASS" || { echo "ERROR: DATABASE_PASS not found"; exit 1; }
          test -n "$REDIS_PASS" || { echo "ERROR: APP_REDIS_PASS not found"; exit 1; }
          mkdir -p deploy-files
          cp apps/server/env-local/.env.production deploy-files/.env.production
          cat > deploy-files/.env <<EOF
          IMG_TAG=${{ env.TAG }}
          MONGODB_ROOT_PASSWORD=${DB_PASS}
          MONGODB_REPLICA_SET_KEY=WalnutAdminNestjsMongoDBReplicasetProdName
          MONGODB_REPLICA_SET_NAME=WalnutAdminNestjsMongoDBReplicasetProdName
          REDIS_PASSWORD=${REDIS_PASS}
          EOF

      - name: Upload env files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          source: "deploy-files/"
          target: /home/ubuntu/walnut-admin/deploy/

      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          script: |
            cd /home/ubuntu/walnut-admin/deploy
            mv -f deploy-files/.env .env
            mv -f deploy-files/.env.production env/.env.production
            rm -rf deploy-files
            # 只替换 IMG_TAG 行，保留服务器上的人工配置（如有）
            if [ -f .env ] && grep -q '^IMG_TAG=' .env; then
              sed -i "s/^IMG_TAG=.*/IMG_TAG=${{ env.TAG }}/" .env
            else
              echo "IMG_TAG=${{ env.TAG }}" >> .env
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f --filter "until=72h"
