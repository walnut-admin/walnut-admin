name: Deploy

# 纯部署：只拉取已发布的镜像并滚动重启，不构建任何东西（历史上 build+deploy 耦合，
# 每次上线都要重建三个镜像，实测 85 分钟；现在部署本身是分钟级）。
#
# 两种用法：
# 1) 被 release.yml 复用（workflow_call）：tag 发布成功后自动部署该 tag
# 2) 手动 workflow_dispatch：**回滚/重发**用 —— image_tag 填上一个发布 tag（如 v0.9.0）

on:
  workflow_call:
    inputs:
      image_tag:
        description: 要部署的镜像 tag（发布 tag，如 v0.10.0）
        required: true
        type: string
      environment:
        description: 目标环境
        required: false
        type: string
        default: prod
  workflow_dispatch:
    inputs:
      image_tag:
        description: 要部署的镜像 tag（回滚时填上一个发布 tag，如 v0.9.0）
        required: true
        type: string
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - prod

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NS: tron1997

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.image_tag }}
      DOTENVX_KEYS: ${{ secrets.ENV_KEYS }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm install 只为 pnpm setup-env（@walnut/scripts 的 dotenvx bin）服务，约 30s（store 有缓存）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decrypt environment files
        uses: ./.github/actions/decrypt-env
        with:
          keys: ${{ env.DOTENVX_KEYS }}

      # 回滚时最容易犯的错是把 tag 写错：先确认三个镜像都真实存在，再动服务器
      - name: Verify images exist in TCR
        run: |
          set -euo pipefail
          echo "${{ secrets.TCR_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.TCR_USERNAME }}" --password-stdin
          for img in nginx backend frontend; do
            if ! docker buildx imagetools inspect "$REGISTRY/$IMAGE_NS/$img:$TAG" > /dev/null 2>&1; then
              echo "::error::镜像不存在：$REGISTRY/$IMAGE_NS/$img:$TAG（tag 写错了？）"
              exit 1
            fi
          done
          echo "三个镜像均存在：$TAG"

      # 生成服务器 env 文件：连接参数改 compose 服务名 + 从解密产物提取数据层凭据拼装 .env
      - name: Generate server env files
        run: |
          set -euo pipefail
          sed -i \
            -e 's|^APP_REDIS_HOST=.*|APP_REDIS_HOST=prod-single-redis|' \
            -e 's|^DATABASE_PG_HOST=.*|DATABASE_PG_HOST=postgres|' \
            apps/server/env-local/.env.production
          PG_USER=$(grep '^DATABASE_PG_USER=' apps/server/env-local/.env.production | cut -d= -f2- | tr -d '"')
          PG_PASS=$(grep '^DATABASE_PG_PASS=' apps/server/env-local/.env.production | cut -d= -f2- | tr -d '"')
          PG_NAME=$(grep '^DATABASE_PG_NAME=' apps/server/env-local/.env.production | cut -d= -f2- | tr -d '"')
          REDIS_PASS=$(grep '^APP_REDIS_PASS=' apps/server/env-local/.env.production | cut -d= -f2- | tr -d '"')
          test -n "$PG_USER" || { echo "ERROR: DATABASE_PG_USER not found"; exit 1; }
          test -n "$PG_PASS" || { echo "ERROR: DATABASE_PG_PASS not found"; exit 1; }
          test -n "$PG_NAME" || { echo "ERROR: DATABASE_PG_NAME not found"; exit 1; }
          test -n "$REDIS_PASS" || { echo "ERROR: APP_REDIS_PASS not found"; exit 1; }
          mkdir -p deploy-files
          cp apps/server/env-local/.env.production deploy-files/.env.production
          # 部署后验证脚本一起上传，部署完在服务器上跑（见下方 Post-deploy verification）
          cp deploy/post-verify.sh deploy-files/post-verify.sh
          # 入口 nginx 配置一起上传：服务器上那份是手工拷贝的，不同步就等于"仓库改了也不生效"
          # （安全响应头就是这么一直缺的）。安装带备份 + nginx -t + 自动回滚，见 Deploy on server。
          mkdir -p deploy-files/nginx
          cp -a deploy/nginx/conf.d deploy-files/nginx/conf.d
          cp -a deploy/nginx/frontend-server.conf deploy-files/nginx/frontend-server.conf
          # postgres / redis 两个容器的凭据都从解密产物提取：POSTGRES_* 与 backend 那份 env 的
          # DATABASE_PG_* 同源同值（compose 里 postgres 服务与 backend 连的是同一套账号）
          cat > deploy-files/.env <<EOF
          IMG_TAG=${TAG}
          POSTGRES_USER=${PG_USER}
          POSTGRES_PASSWORD=${PG_PASS}
          POSTGRES_DB=${PG_NAME}
          REDIS_PASSWORD=${REDIS_PASS}
          EOF
          # PG seed 通道的运行体（@walnut/scripts 的 db-seed-pg，bin + src 整目录打进去，
          # 不手挑依赖闭包 —— 挑漏一个 import 要到服务器上才炸）随包上传。生产服务器上没有仓库
          # 也没有 Node 工具链，部署时 docker cp 进 backend 容器执行：容器里有 Node 24（原生类型
          # 剥离直接跑 .ts）和 seed-pg 需要的全部运行时依赖（pg / @serenity-kit/opaque）。
          mkdir -p deploy-files/seed-tooling
          cp -r packages/tooling/scripts/bin packages/tooling/scripts/src deploy-files/seed-tooling/
          # 固定 ESM 语义：backend 镜像的 /app/package.json（@walnut/server）没有 type 字段，
          # 不补这一份的话模块语法要靠 Node 的探测兜底
          printf '{"type":"module"}\n' > deploy-files/seed-tooling/package.json
          tar -czf deploy-files/seed-tooling.tar.gz -C deploy-files/seed-tooling .
          rm -rf deploy-files/seed-tooling
          echo "deploy-files 生成完成（IMG_TAG=${TAG}）"

      - name: Upload env files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          source: "deploy-files/"
          target: /home/ubuntu/walnut-admin/deploy/

      # 证据链：部署前后各打印一次容器→镜像映射，避免"4 秒就成功"这种无法自证的部署
      - name: Deploy on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          script: |
            set -e
            cd /home/ubuntu/walnut-admin/deploy

            # ---- 写入 CI 生成的环境文件 ----
            mv -f deploy-files/.env .env
            mv -f deploy-files/.env.production env/.env.production
            # 验证脚本与 seed 通道运行体留在部署目录，供后续步骤调用（deploy-files 其余内容清掉）
            mv -f deploy-files/post-verify.sh post-verify.sh
            mv -f deploy-files/seed-tooling.tar.gz seed-tooling.tar.gz

            # ---- 同步入口 nginx 配置（仓库是唯一真源）----
            #
            # 为什么必须同步：`nginx/conf.d/*.conf`（安全响应头、location 规则）在服务器上是**手工
            # 拷贝**的，而部署流程原先只同步 env 与 seed 资产 ⇒ 仓库里后来加/改的配置**永远到不了
            # 线上**。2026-09-30 实测：post-verify 要求两个域名都有 4 个安全响应头，仓库里齐全
            # （`pnpm lint:nginx-headers` 逐块核对），而线上一直不 PASS ⇒ 就是这份拷贝陈旧。
            #
            # 三道护栏（这是**线上配置**，不能裸奔）：
            #   1) 覆盖前把现有 conf **备份**到 nginx-backup/<时间戳>/；
            #   2) 覆盖后先 `nginx -t` 校验，**只有通过才 reload**；
            #   3) 校验不通过 ⇒ 从备份**自动回滚**并 reload 旧配置（结果是"维持原样 + 一条 WARN"，
            #      不会把入口 nginx 弄挂）。
            if [ -d deploy-files/nginx ]; then
              echo "--- phase: 同步 nginx 配置"
              ts="$(date +%Y%m%d%H%M%S)"
              mkdir -p "nginx-backup/$ts"
              cp -a nginx/conf.d/. "nginx-backup/$ts/" 2>/dev/null || true
              cp -a nginx/frontend-server.conf "nginx-backup/$ts/frontend-server.conf" 2>/dev/null || true
              mkdir -p nginx/conf.d
              cp -a deploy-files/nginx/conf.d/. nginx/conf.d/
              cp -a deploy-files/nginx/frontend-server.conf nginx/frontend-server.conf 2>/dev/null || true
              # 判据不只看 `nginx -t`（**语法**），还要看入口 nginx **是否真的应答**：
              # `nginx -t` 对"证书文件不存在/路径不对"这类问题是**通过**的，而线上表现就是
              # 443 完全没响应（外网实测 000 / Cloudflare 522，2026-09-30）。所以这里补一条本机探测。
              ok=1
              docker compose exec -T nginx nginx -t >/dev/null 2>&1 || ok=0
              if [ "$ok" = "1" ]; then
                docker compose exec -T nginx nginx -s reload >/dev/null 2>&1 || true
                sleep 2
                code="$(curl -sk -o /dev/null -w '%{http_code}' --resolve "www.walnut-admin.com:443:127.0.0.1" https://www.walnut-admin.com/ -m 8 || true)"
                case "$code" in
                  200|301|302) ;;
                  *) echo "  WARN 入口 nginx 探测返回 ${code:-无响应}，回滚配置"; ok=0 ;;
                esac
              else
                echo "  WARN 新配置未通过 nginx -t，回滚配置"
              fi
              if [ "$ok" != "1" ]; then
                cp -a "nginx-backup/$ts/." nginx/conf.d/ 2>/dev/null || true
                docker compose exec -T nginx nginx -s reload >/dev/null 2>&1 || true
                sleep 2
                code2="$(curl -sk -o /dev/null -w '%{http_code}' --resolve "www.walnut-admin.com:443:127.0.0.1" https://www.walnut-admin.com/ -m 8 || true)"
                echo "  回滚后探测：${code2:-无响应}（备份保留在 nginx-backup/$ts）"
              else
                echo "  ok   nginx 配置已同步、探测通过（备份：nginx-backup/$ts）"
              fi
            fi

            rm -rf deploy-files
            # 只替换 IMG_TAG 行，保留服务器上的人工配置（如有）
            if grep -q '^IMG_TAG=' .env; then
              sed -i "s/^IMG_TAG=.*/IMG_TAG=${{ env.TAG }}/" .env
            else
              echo "IMG_TAG=${{ env.TAG }}" >> .env
            fi

            echo "=== 部署前 ==="
            docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}' || true

            # 服务器端登录 TCR：runner 上的 docker login 不作用于服务器
            echo "${{ secrets.TCR_PASSWORD }}" | docker login ccr.ccs.tencentyun.com -u "${{ secrets.TCR_USERNAME }}" --password-stdin

            docker compose pull

            # **先起容器、不等健康**：空库环境下后端会在启动期读不到 app_setting 而报错
            # （2026-09-30 实测：AppTechTasksService 在 onModuleInit 里 getSetting → JSON.parse('undefined')
            # 抛异常 ⇒ 容器起不来）。所以顺序必须是：up -d（不等）→ 注入参考数据 → 再等健康
            # （见后面 "Wait for health after seeding" 一步）。这里**不能**用 --wait，
            # 否则首次部署到空库时会在数据注入之前就超时失败。
            docker compose up -d

            echo "=== 部署后 ==="
            docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
            docker inspect --format '{{.Name}} → {{.Config.Image}}' walnut-nginx walnut-frontend walnut-backend

            docker image prune -f --filter "until=72h"

            # ---- 健康检查：经 nginx 容器访问前端（--resolve 指到本机，绕过公网/CDN）----
            command -v curl >/dev/null || { echo "ERROR: 服务器缺少 curl，无法健康检查"; exit 1; }
            code=$(curl -sk -o /dev/null -w '%{http_code}' --resolve www.walnut-admin.com:443:127.0.0.1 https://www.walnut-admin.com/ -m 10 || true)
            test "$code" = "200" -o "$code" = "301" -o "$code" = "302" || { echo "ERROR: 部署后健康检查失败（HTTP $code）"; exit 1; }
            echo "部署成功：IMG_TAG=${{ env.TAG }}，健康检查 HTTP $code"

      # 部署后验证（post-verify）：上一步只保证"容器起来了 + healthcheck 过"，
      # 这一步持续观察 2 分钟，证明服务真的在工作：镜像 tag 正确、后端出现启动标记、
      # 后端日志无致命错误、前端/入口 nginx 无 5xx、公网域名端到端 200。详见 deploy/post-verify.sh
      # 按 Release 记录的 digest **核对**线上实际产物（P3-lite 的后半）。
      #
      # 为什么"核对"而不是"改成按 digest 拉取"：compose 文件在服务器上是**手工维护的一份拷贝**
      # （见 deploy/README.md 的首次初始化），要按 digest 拉取就得把三处 `image:` 改成
      # `…@sha256:…` 并同步改服务器上那份 —— 漏改一次就**静默退回按 tag 拉取**，风险比收益大。
      # 核对方案完全不碰 compose：拉取照旧走 `:vX.Y.Z`，事后逐镜像比对 RepoDigests。
      #
      # 它抓的是什么：tag 被重打、镜像被重建、或 registry 上被别人覆盖 —— 那时线上跑的已经不是
      # 发布时那份产物，而**只看 tag 永远看不出来**。比对不上就红，并把两边都打出来。
      - name: Read digests from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${{ env.TAG }}" --pattern digests.json --dir . --clobber
          cat digests.json
          for img in nginx backend frontend; do
            value=$(jq -r --arg k "$img" '.[$k] // "n/a"' digests.json)
            echo "DIGEST_$(echo "$img" | tr '[:lower:]' '[:upper:]')=$value" >> "$GITHUB_ENV"
          done

      - name: Verify image digests on server
        uses: appleboy/ssh-action@v0.1.10
        env:
          DIGEST_NGINX: ${{ env.DIGEST_NGINX }}
          DIGEST_BACKEND: ${{ env.DIGEST_BACKEND }}
          DIGEST_FRONTEND: ${{ env.DIGEST_FRONTEND }}
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          envs: DIGEST_NGINX,DIGEST_BACKEND,DIGEST_FRONTEND
          script: |
            set -e
            cd /home/ubuntu/walnut-admin/deploy
            echo "--- phase: 核对镜像 digest"
            fail=0
            # 一次核对一个镜像。**两道防假红的门**（2026-09-30 实测被这道闸拦红过一次发版）：
            #
            # ① 取 digest 要**先拿容器的镜像 ID、再 inspect 那个 ID**：
            #    `docker image inspect` 只认镜像引用/ID，**不认容器名** —— 原来直接拿容器名去 inspect，
            #    必然取不到 ⇒ 被当成 MISMATCH ⇒ 整步红（本地没有 Docker，我上轮只重放了"比对逻辑"、
            #    没重放真实命令，所以没抓到）。
            # ② **取不到就不判**：拿不到 actual 时打 warn 并跳过 —— 与"发版时没记录 digest"同档。
            #    这道闸该红的只有一种情形：**两边都拿得到、且真的不一致**（那时才是"线上产物被换过"）。
            #    宁可说"核对不了"，也不能因为命令写错而拦红一次发版（代价是整轮 + 后面的步骤全 skip）。
            check() {
              name="$1"; expected="$2"; container="$3"
              if [ -z "$expected" ] || [ "$expected" = "n/a" ]; then
                echo "  skip   $name（发版时没记录 digest，无法核对）"
                return 0
              fi
              image_id=$(docker inspect "$container" --format '{{.Image}}' 2>/dev/null || true)
              if [ -z "$image_id" ]; then
                echo "  warn   $name（拿不到容器 $container 的镜像 ID，跳过核对）"
                return 0
              fi
              actual=$(docker image inspect "$image_id" --format '{{range .RepoDigests}}{{println .}}{{end}}' 2>/dev/null | head -1)
              if [ -z "$actual" ]; then
                echo "  warn   $name（镜像 $image_id 没有 RepoDigests，跳过核对）"
                return 0
              fi
              case "$actual" in
                *"$expected") echo "  ok     $name  $expected" ;;
                *) echo "  MISMATCH $name"; echo "         期望 $expected"; echo "         实际 $actual"; fail=1 ;;
              esac
            }
            check nginx "$DIGEST_NGINX" walnut-nginx
            check backend "$DIGEST_BACKEND" walnut-backend
            check frontend "$DIGEST_FRONTEND" walnut-frontend
            if [ "$fail" -ne 0 ]; then
              echo "ERROR: 线上产物与发布时记录的 digest 不一致 —— 该 tag 的镜像被重建/覆盖过"
              exit 1
            fi
            echo "三个镜像的 digest 与发布记录一致"

      # ---- 参考数据注入（PG seed 通道）----
      #
      # **每次部署都跑**，不再挂在输入开关上：tag 推送触发的发版走 `workflow_call`，根本没法设置
      # 这个输入 —— 挂在开关上时"打 tag 自动部署"这条路永远不注入数据（2026-09-30 实测：
      # v0.1.2 / v0.1.3 两次发版的注入步骤全是 skipped，线上库一直是空的）。
      #
      # 语义（`pnpm db:seed:pg` = walnut-db-seed-pg，与开发侧同一条命令）：按 id upsert，幂等可重放，
      # 库**收敛到仓** —— 仓（该 tag 的 seed 资产）是参考数据的唯一真源，已存在的行整行刷新为仓内
      # 值；junction 表 DO NOTHING（只补缺不回收）；app_key 缺 ACTIVE 才现造。运维在后台改过菜单/
      # 设置的，必须走回灌通道（`pnpm db:export:pg` 出差异 → PR 审 → 随发版走）带回来，否则下次
      # 部署会被冲掉 —— 这是相对 mongoimport"非空整集跳过"时代的**有意变更**：跳过语义有个结构性
      # 副作用（后续版本新增的行永远上不了已有集合的库），收敛语义没有。
      #
      # 为什么跑在 **backend 容器**里：生产服务器上没有仓库与 Node 工具链，而 backend 镜像里
      # Node 24（原生类型剥离直接执行 .ts）与 seed-pg 需要的运行时依赖（pg / @serenity-kit/opaque）
      # 都是现成的，且它在 compose 内网里正好可达 postgres。凭据不落命令行 —— 连接参数从容器里
      # 那份 env 文件读（`--env-file`），该文件已在 Generate server env files 一步把
      # DATABASE_PG_HOST 改写成 compose 服务名。
      #
      # 复核（psql 行数）跑在 **postgres 容器**里：官方镜像自带 psql，凭据用容器自己的
      # POSTGRES_* 环境变量，不落到命令行上。
      - name: Download seed asset from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p seed-asset
          gh release download "${{ env.TAG }}" --pattern 'walnut-admin-seed-*.tar.gz' --dir seed-asset
          ls -l seed-asset

      - name: Upload seed asset to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          source: "seed-asset/"
          target: /home/ubuntu/walnut-admin/deploy/

      - name: Seed reference data on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/walnut-admin/deploy

            rm -rf seed-staging seed-tooling && mkdir -p seed-staging seed-tooling
            tar xzf seed-asset/walnut-admin-seed-*.tar.gz -C seed-staging
            test -d seed-staging/seed || { echo "ERROR: 资产里没有 seed/ 目录"; exit 1; }
            tar xzf seed-tooling.tar.gz -C seed-tooling

            # 拷进 backend 容器的 /app/ 下：Node 按**导入文件的位置**向上找 node_modules 解析
            # pg / opaque，放 /tmp 这类 /app 之外的地方会 ERR_MODULE_NOT_FOUND
            BID=$(docker compose ps -q backend)
            test -n "$BID" || { echo "ERROR: 找不到 backend 容器"; exit 1; }
            docker cp seed-staging/seed "$BID":/app/seed-ref
            docker cp seed-tooling/. "$BID":/app/seed-tooling/

            echo "--- phase: db:seed:pg（按 id upsert，库收敛到仓）"
            docker compose exec -T backend node /app/seed-tooling/bin/db-seed-pg.ts \
              --seed-dir /app/seed-ref \
              --env-file /app/env-local/.env.production

            # 复核：参考表行数（可复核的证据）。psql 在 postgres 容器里跑，
            # 凭据用容器自己的 POSTGRES_* 环境变量（宿主 shell 里没有这些变量）
            echo "--- phase: 注入后行数（可复核的证据）"
            PCID=$(docker compose ps -q postgres)
            test -n "$PCID" || { echo "ERROR: 找不到 postgres 容器"; exit 1; }
            for t in app_setting sys_dict_data sys_dict_type sys_lang sys_locale sys_menu sys_role sys_user; do
              n=$(docker compose exec -T postgres sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tA -c 'SELECT count(*) FROM $t'")
              case "$n" in
                ''|*[!0-9]*) echo "  $t  查询失败"; exit 1 ;;
                *) echo "  $t  $n 行" ;;
              esac
            done

            echo "--- phase: 清理"
            docker compose exec -T backend rm -rf /app/seed-ref /app/seed-tooling
            rm -rf seed-staging seed-tooling seed-asset
            echo "参考数据注入完成：参考表已对齐仓内 seed 形态"

      # 数据就位之后**才**等健康检查。
      #
      # 为什么把它单独放在最后：后端启动期会读 app_setting（`AppTechTasksService.onModuleInit` →
      # `AppTechCacheAppSettingsService.getSetting`），空库时 `JSON.parse('undefined')` 直接抛异常、
      # 容器起不来（2026-09-30 首次部署实测）。所以"等健康"必须排在注入之后，否则首次部署到空库
      # 一定超时失败（`up -d --wait` 会在数据注入之前就放弃）。
      #
      # 没有可跳的情形 —— 它对**每一轮部署**都有意义：它是"部署完真的健康"的判据
      # （compose >= 2.17 支持 `--wait`；老版本退化成只确认容器在跑）。
      - name: Wait for health after seeding
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/walnut-admin/deploy
            if docker compose version --short | awk -F. '{ exit !($2 >= 17) }'; then
              docker compose up -d --wait --wait-timeout 180
            else
              docker compose up -d
            fi
            echo "=== 健康检查后 ==="
            docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
            # 后端有没有在启动期报错（空库那条 JSON.parse 就是在这里暴露的）
            docker compose logs --tail=40 backend | grep -E "ERROR|SyntaxError" && {
              echo "ERROR: 后端日志里有启动期错误（上面这些行）"; exit 1
            } || echo "后端日志无启动期错误"

      # 部署后验证放在**最后**：它要观察 2 分钟（镜像 tag / 后端启动标记 / 无致命错误 / 无 5xx /
      # 公网 200），而首次部署到空库时后端会在注入参考数据之前先崩一轮 —— 排在注入之前必然假红
      # （2026-09-30 实测）。顺序：up -d（不等）→ 注入数据 → 等健康 → 再跑这条持续观察。
      # 诊断：在 **runner 侧**直接探测源站（`--resolve` 指到服务器 IP，绕开 CDN），把 post-verify
      # 判的四项值打出来。
      #
      # 为什么需要它（2026-09-30 连吃三次"假设驱动修复"的教训）：post-verify 跑在服务器上，
      # 它的输出我**读不到** —— 步骤日志要鉴权，而 ssh-action 远端的 `::error::` **不会**变成注解
      # （实测过）。但 runner 侧**失败步骤的输出尾部会自动成为注解**（bake 的报错、TS1434 都是
      # 这样读到的）⇒ 这里刻意在任一项不满足时 exit 1 并打全四项值，失败原因就自己浮出来了。
      - name: Diagnose origin (runner side)
        env:
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
        run: |
          set -uo pipefail
          FRONT=www.walnut-admin.com
          API=api.walnut-admin.com
          PROBE=/w/v1/static/images/demo.png
          code() { curl -sk -o /dev/null -w '%{http_code}' --resolve "$1:443:$SERVER_HOST" "https://$1$2" -m 12 || true; }
          FC="$(code "$FRONT" /)"
          AC="$(code "$API" "$PROBE")"
          FH="$(curl -sk -D - -o /dev/null --resolve "$FRONT:443:$SERVER_HOST" "https://$FRONT/" -m 12 || true)"
          AH="$(curl -sk -D - -o /dev/null --resolve "$API:443:$SERVER_HOST" "https://$API/" -m 12 || true)"
          miss=''
          for n in Strict-Transport-Security X-Content-Type-Options X-Frame-Options Referrer-Policy; do
            printf '%s\n' "$FH" | grep -qi "^$n:" || miss="$miss front:$n"
            printf '%s\n' "$AH" | grep -qi "^$n:" || miss="$miss api:$n"
          done
          echo "origin 诊断（--resolve …:$SERVER_HOST）"
          echo "  front /  -> $FC"
          echo "  api $PROBE -> $AC"
          echo "  缺失安全头 ->${miss:- 无}"
          printf '%s\n' "$FH" | head -20
          if [ "$FC" != "200" ] || [ "$AC" != "200" ] || [ -n "$miss" ]; then
            # **只告警、不让整轮失败**（2026-09-30 改）：
            # 源站从外网不可达（front/api=000）是**基础设施**问题（安全组 / 公网 IP / 云防火墙），
            # 不是本仓代码能修的；而它原先在这里 exit 1，会把后面的 `Post-deploy verification`
            # 直接 skip 掉 ⇒ 整轮 release 因为一个"网络可达性"观察项而失败，且掩盖了 post-verify
            # 自己的判定。降级为 warning：注解里照样看得见这三个值，但发版判据交回给 post-verify。
            echo "::warning::ORIGIN-DIAG front=$FC api=$AC missing=${miss:-无}（源站从外网不可达，见基础设施侧）"
            echo "ORIGIN-DIAG-NOT-OK front=$FC api=$AC missing=$miss"
          fi

      # 失败原因**必须能被人看到**：post-verify 的每一条判据失败都会打一行
      # `POST-VERIFY FAILED: <原因>`（脚本里那句原本带一个叹号符号，这里按仓库的 emoji 门禁去掉），
      # 但它埋在步骤日志里 —— 而日志需要鉴权才能读。
      # 所以这里把那一行**转成 GitHub annotation**（`::error::` 由 runner 解析步骤 stdout 得到，
      # 远端的输出会经 ssh-action 落到同一个 stdout）。有它之后，任何一次失败的原因都能从
      # run 的注解里直接读到，不必再让人翻日志。
      - name: Post-deploy verification
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            cd /home/ubuntu/walnut-admin/deploy
            # 不用管道：`… | tee` 的退出码是 **tee 的**（恒为 0）⇒ 既不会触发注解、
            # 又会把 post-verify 的失败吞成"通过"。改成重定向到文件，再自己判 exit code。
            if bash post-verify.sh 24 5 > /tmp/post-verify.log 2>&1; then
              cat /tmp/post-verify.log
              echo "::notice::post-verify 通过"
              exit 0
            fi
            cat /tmp/post-verify.log
            reason="$(grep -m1 'POST-VERIFY FAILED' /tmp/post-verify.log || true)"
            [ -n "$reason" ] || reason="（没抓到 POST-VERIFY FAILED 那一行，见上面的日志）"
            echo "::error::post-verify 失败：$reason"
            exit 1

      # 把服务器上 post-verify 的**判定原文**取回 runner 并变成注解。
      #
      # 为什么必须这么做（2026-09-30 反复踩过）：post-verify 跑在服务器上，它的输出我读不到 ——
      # ssh-action 远端的 `::error::` **不会**被 runner 解析成注解（实测），而步骤日志要鉴权。
      # 只有 **runner 侧 `run:` 步骤的 stdout** 会进注解。所以这里在 runner 上装 sshpass、
      # 直接把 /tmp/post-verify.log 的判定行抓回来（失败时两条判据行都在：每轮的 `#N …` 快照
      # 与最终的 `POST-VERIFY FAILED: <原因>`）。
      - name: Fetch post-verify verdict (annotation)
        if: failure()
        env:
          SSHPASS: ${{ secrets.PROD_SERVER_PASSWORD }}
          SUSER: ${{ secrets.PROD_SERVER_USERNAME }}
          SHOST: ${{ secrets.PROD_SERVER_HOST }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1 || true
          command -v sshpass >/dev/null 2>&1 || { echo "::warning::没装上 sshpass，取不到 post-verify 判定"; exit 0; }
          out="$(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            "$SUSER@$SHOST" 'tail -40 /tmp/post-verify.log 2>/dev/null || echo "（服务器上没有 /tmp/post-verify.log）"' 2>&1 || true)"
          echo "$out"
          # 容器与监听现状。**必须把 ssh 的 known_hosts 提示行滤掉** —— 2026-09-30 实测它排在
          # 最前面，把注解前 320 字符全占了，真正的输出被挤没（等于白跑一轮）。
          # 这几条直接回答两个问题：① 容器到底存不存在；② 443 为什么从外面连不上。
          state="$(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            "$SUSER@$SHOST" 'cd /home/ubuntu/walnut-admin/deploy 2>/dev/null || cd /home/ubuntu/walnut-admin; echo "PS:"; docker ps -a --format "{{.Names}}|{{.Status}}" 2>&1 | head -12; echo "SERVICES:"; docker compose config --services 2>&1 | head -10; echo "LISTEN:"; (ss -ltn 2>/dev/null || netstat -ltn) | grep -E ":443|:80 " | head -6; echo "DISK:"; df -h / | tail -1' 2>/dev/null || true)"
          state_clean="$(printf '%s\n' "$state" | grep -v 'Permanently added' | tr '\n' ' ' | cut -c1-600)"
          echo "::warning::容器与监听：${state_clean:-（取不到）}"
          # post-verify 的判定原文（这一步存在的**首要理由**，别删）。
          reason="$(printf '%s\n' "$out" | grep -m1 'POST-VERIFY FAILED' || true)"
          # 快照行的关键字是 `就绪=`（2026-09-30 起是 `#N 就绪=…`；早前叫 `后端就绪=`，改过名，
          # 取值时别再按旧名字 grep —— 否则拿不到"是哪一项不满足"）。
          last="$(printf '%s\n' "$out" | grep -m1 '就绪=' || true)"
          if [ -n "$reason" ]; then
            echo "::error::post-verify 判定：$reason"
          else
            echo "::error::post-verify 未通过但没抓到判据行；最后一个快照：${last:-（无）}"
          fi
          [ -n "$last" ] && echo "::warning::post-verify 最后一轮快照：$last"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 部署结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 环境 | ${INPUT_ENV} |"
            echo "| IMG_TAG | \`${TAG}\` |"
            echo "| 部署步骤 | 见 Deploy on server |"
            echo "| 部署后验证 | 见 Post-deploy verification（失败即整个 job 失败） |"
            echo "| 结果 | ${{ job.status }} |"
            echo ""
            echo "> 验证脚本：[deploy/post-verify.sh](https://github.com/walnut-admin/walnut-admin/blob/main/deploy/post-verify.sh)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUT_ENV: ${{ inputs.environment }}
