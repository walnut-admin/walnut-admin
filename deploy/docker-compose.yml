services:
  # ---------- 入口 ----------
  nginx:
    image: ccr.ccs.tencentyun.com/tron1997/nginx:${IMG_TAG}
    restart: always
    container_name: walnut-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  # ---------- 应用 ----------
  frontend:
    image: ccr.ccs.tencentyun.com/tron1997/frontend:${IMG_TAG}
    restart: always
    container_name: walnut-frontend

  backend:
    image: ccr.ccs.tencentyun.com/tron1997/backend:${IMG_TAG}
    restart: always
    container_name: walnut-backend
    environment:
      # 让位：cron 与 bootstrap 任务改由下面的 worker service 承接。
      # **必须写在容器 env**（不能只写进 ./env/.env.production）：apps/api/src/app/schedule.composition.ts:24-26
      # 在**模块定义期**读 process.env，早于 ConfigModule 加载 env 文件 —— 写文件里太晚，
      # api 照旧注册 ScheduleModule.forRoot()，与 worker 双跑同一批 @Cron（apps/worker/README.md 的「cron 让位机制」）。
      # 反过来的代价同样是语义：设了它而 worker 没起 = **没有任何 cron tick**（不是延后，是彻底不跑）。
      - WORKER_STANDALONE=true
    # bind mount 到 config.module.ts 读取的路径（process.cwd()/env-local/.env.production，容器内 /app/env-local/）
    # 与 env_file 注入 process.env 相比，文件缺失会在启动时立即暴露而非静默
    volumes:
      - ./env/.env.production:/app/env-local/.env.production:ro
      - ./logs:/app/logs
    depends_on:
      # 两个数据层依赖都 healthy 才起 backend：启动期就会连 PG / Redis
      # （连接由 env 里 DATABASE_PG_HOST=postgres / APP_REDIS_HOST=redis 指到本服务）
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 探 raw Express 探针 /health/ready（W2-B）：PG SELECT 1 + Redis PING 都真实可用才 200，
      # 任一依赖挂 → 503。镜像内是 Node，用 fetch 断言 r.ok —— wget/curl 只看「有响应」，
      # 对状态码 / body 不敏感。探针在 nginx 上被挡（/health/ → 404），只走编排内网。
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/ready', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # cron / 队列消费从 web 进程分流的第二进程（D3=A：真接线）。
  # **同一镜像、只换 command**：入口 dist/apps/worker/src/main.js 由 api 的同一次 `nest build api`
  # 一并产出（apps/server/infra/nest/prod.json:52 的 filenames 含 apps/worker/src），镜像不必有第二个 target。
  # 单实例约束（ADR 0025）：1 个 api + 0 或 1 个 worker。**不要扩容本服务** ——
  # @Cron 是进程内定时器，没有分布式锁，两个 worker 会把同一批任务各跑一遍。
  worker:
    image: ccr.ccs.tencentyun.com/tron1997/backend:${IMG_TAG}
    restart: always
    container_name: walnut-worker
    # 覆盖镜像 CMD（apps/server/Dockerfile:41 是 api 入口）；cwd 由镜像的 WORKDIR /app 提供。
    # 不要改成 `pnpm start:worker`：它经 cross-env 注入 env，而 cross-env 是 devDependency，
    # `pnpm deploy --prod` 的产物里没有。
    command: ['node', 'dist/apps/worker/src/main.js']
    environment:
      # 与 backend 同一条（容器 env，模块定义期求值 —— 见 backend 那段注释）
      - WORKER_STANDALONE=true
    volumes:
      # 与 backend 共用同一份 env（PG / Redis 同源）；文件缺失会在启动时立刻暴露
      - ./env/.env.production:/app/env-local/.env.production:ro
      # 日志**单独的宿主目录**：两个进程都往 /app/logs 写 winston-daily-rotate 的按天文件，
      # 共写同一批文件名会在轮转时互相 rename/截断（backend 挂的是 ./logs）。
      - ./logs/worker:/app/logs
    depends_on:
      # worker 启动即连 PG（TypeORM）与 Redis（Bull + 缓存），与 backend 同口径
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # **不写 healthcheck**：worker 没有 HTTP 监听（apps/worker/src/main.ts:21 用 createApplicationContext），
    # 唯一现成的存活信号是日志里的 `cron jobs: N`。`docker compose up -d --wait` 对没有 healthcheck
    # 的服务只要求 running，所以不写探针也能收敛。

  # ---------- 数据层 ----------
  # 单节点 PostgreSQL（ADR 0021 Decision 1：单节点即完整 ACID，不再需要副本集拓扑）。
  # 凭据从 .env 注入，由 CI 从解密后的 DATABASE_PG_* 拼装（与 backend 那份 env 同源同值）。
  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: always
    container_name: prod-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # PG 18 官方镜像的挂载点是 /var/lib/postgresql（PGDATA 在其版本子目录下），
      # 挂上一层目录便于未来大版本升级（pg_upgrade 双版本目录并存）
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # bitnami/redis 免费镜像已冻结迁入 bitnamilegacy（ADR 0021 Decision 4），换 Docker 官方镜像；
  # bitnami 卷内是 /bitnami/redis/data 目录结构，与官方镜像的 /data 不兼容，故换新卷名 ——
  # redis 里只有缓存/会话数据，可弃
  redis:
    image: docker.io/library/redis:8-alpine
    restart: always
    container_name: prod-single-redis
    # 密码与禁用清库命令对齐原 bitnami 形态：requirepass 对齐 env 的 APP_REDIS_PASS，
    # FLUSHDB/FLUSHALL 改名为空串 = 彻底禁用（防误清线上缓存/会话）
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --rename-command
      - FLUSHDB
      - ''
      - --rename-command
      - FLUSHALL
      - ''
    healthcheck:
      # 带密码 PING（密码由 compose 从 deploy/.env 的 REDIS_PASSWORD 插值，与本服务 command 同源）。
      # 用 argv 直传（CMD）而不是 CMD-SHELL：密码含 shell 元字符（$ ` " \ 等）时不会被 shell
      # 二次解析/截断；compose 的 ${REDIS_PASSWORD} 插值仍在宿主侧完成。
      # --no-auth-warning 避免密码告警刷日志。backend 的 depends_on/healthcheck 依赖它先 healthy
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_prod_data:/data

volumes:
  postgres_data:
    driver: local
  redis_prod_data:
    driver: local
