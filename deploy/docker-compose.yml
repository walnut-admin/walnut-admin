services:
  # ---------- 入口 ----------
  nginx:
    image: ccr.ccs.tencentyun.com/tron1997/nginx:${IMG_TAG}
    restart: always
    container_name: walnut-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  # ---------- 应用 ----------
  frontend:
    image: ccr.ccs.tencentyun.com/tron1997/frontend:${IMG_TAG}
    restart: always
    container_name: walnut-frontend

  backend:
    image: ccr.ccs.tencentyun.com/tron1997/backend:${IMG_TAG}
    restart: always
    container_name: walnut-backend
    # bind mount 到 config.module.ts 读取的路径（process.cwd()/env-local/.env.production，容器内 /app/env-local/）
    # 与 env_file 注入 process.env 相比，文件缺失会在启动时立即暴露而非静默
    volumes:
      - ./env/.env.production:/app/env-local/.env.production:ro
      - ./logs:/app/logs
    depends_on:
      - prod-mongodb-primary
      - prod-mongodb-secondary
      - redis
    healthcheck:
      # 真实存在的静态资源路由（main.ts useStaticAssets，绕过全部守卫返回 200），带 5s 超时
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/w/v1/static/images/demo.png', { signal: AbortSignal.timeout(5000) }).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------- 数据层（沿用现有容器名与卷名，无缝接管）----------
  prod-mongodb-primary:
    image: docker.io/bitnami/mongodb:latest
    restart: always
    container_name: prod-mongodb-primary
    environment:
      - MONGODB_REPLICA_SET_MODE=primary
      - MONGODB_ROOT_USER=root
      - MONGODB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD}
      - MONGODB_REPLICA_SET_KEY=${MONGODB_REPLICA_SET_KEY}
      - MONGODB_REPLICA_SET_NAME=${MONGODB_REPLICA_SET_NAME}
      - MONGODB_ADVERTISED_HOSTNAME=prod-mongodb-primary
    volumes:
      - 'mongodb_master_data:/bitnami/mongodb'

  prod-mongodb-secondary:
    image: docker.io/bitnami/mongodb:latest
    restart: always
    container_name: prod-mongodb-secondary
    depends_on:
      - prod-mongodb-primary
    environment:
      - MONGODB_REPLICA_SET_MODE=secondary
      - MONGODB_INITIAL_PRIMARY_HOST=prod-mongodb-primary
      - MONGODB_INITIAL_PRIMARY_PORT_NUMBER=27017
      - MONGODB_INITIAL_PRIMARY_ROOT_USER=root
      - MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD}
      - MONGODB_REPLICA_SET_KEY=${MONGODB_REPLICA_SET_KEY}
      - MONGODB_REPLICA_SET_NAME=${MONGODB_REPLICA_SET_NAME}
      - MONGODB_ADVERTISED_HOSTNAME=prod-mongodb-secondary

  prod-mongodb-arbiter:
    image: docker.io/bitnami/mongodb:latest
    restart: always
    container_name: prod-mongodb-arbiter
    depends_on:
      - prod-mongodb-primary
    environment:
      - MONGODB_REPLICA_SET_MODE=arbiter
      - MONGODB_INITIAL_PRIMARY_HOST=prod-mongodb-primary
      - MONGODB_INITIAL_PRIMARY_PORT_NUMBER=27017
      - MONGODB_INITIAL_PRIMARY_ROOT_USER=root
      - MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD}
      - MONGODB_REPLICA_SET_KEY=${MONGODB_REPLICA_SET_KEY}
      - MONGODB_REPLICA_SET_NAME=${MONGODB_REPLICA_SET_NAME}
      - MONGODB_ADVERTISED_HOSTNAME=prod-mongodb-arbiter

  redis:
    image: docker.io/bitnami/redis:latest
    restart: always
    container_name: prod-single-redis
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/bitnami/redis/data

volumes:
  mongodb_master_data:
    driver: local
  redis_data:
    driver: local
