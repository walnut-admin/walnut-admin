services:
  # ---------- 入口 ----------
  nginx:
    image: ccr.ccs.tencentyun.com/tron1997/nginx:${IMG_TAG}
    restart: always
    container_name: walnut-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  # ---------- 应用 ----------
  frontend:
    image: ccr.ccs.tencentyun.com/tron1997/frontend:${IMG_TAG}
    restart: always
    container_name: walnut-frontend

  backend:
    image: ccr.ccs.tencentyun.com/tron1997/backend:${IMG_TAG}
    restart: always
    container_name: walnut-backend
    # bind mount 到 config.module.ts 读取的路径（process.cwd()/env-local/.env.production，容器内 /app/env-local/）
    # 与 env_file 注入 process.env 相比，文件缺失会在启动时立即暴露而非静默
    volumes:
      - ./env/.env.production:/app/env-local/.env.production:ro
      - ./logs:/app/logs
    depends_on:
      # pg_isready 过了才起 backend：启动期就会连 PG（连接由 env 里 DATABASE_PG_HOST=postgres 指到本服务）
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # 真实存在的静态资源路由（main.ts useStaticAssets，绕过全部守卫返回 200），带 5s 超时
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/w/v1/static/images/demo.png', { signal: AbortSignal.timeout(5000) }).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------- 数据层 ----------
  # 单节点 PostgreSQL（ADR 0021 Decision 1：单节点即完整 ACID，不再需要副本集拓扑）。
  # 凭据从 .env 注入，由 CI 从解密后的 DATABASE_PG_* 拼装（与 backend 那份 env 同源同值）。
  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: always
    container_name: prod-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # PG 18 官方镜像的挂载点是 /var/lib/postgresql（PGDATA 在其版本子目录下），
      # 挂上一层目录便于未来大版本升级（pg_upgrade 双版本目录并存）
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # bitnami/redis 免费镜像已冻结迁入 bitnamilegacy（ADR 0021 Decision 4），换 Docker 官方镜像；
  # bitnami 卷内是 /bitnami/redis/data 目录结构，与官方镜像的 /data 不兼容，故换新卷名 ——
  # redis 里只有缓存/会话数据，可弃
  redis:
    image: docker.io/library/redis:8-alpine
    restart: always
    container_name: prod-single-redis
    # 密码与禁用清库命令对齐原 bitnami 形态：requirepass 对齐 env 的 APP_REDIS_PASS，
    # FLUSHDB/FLUSHALL 改名为空串 = 彻底禁用（防误清线上缓存/会话）
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --rename-command
      - FLUSHDB
      - ''
      - --rename-command
      - FLUSHALL
      - ''
    volumes:
      - redis_prod_data:/data

volumes:
  postgres_data:
    driver: local
  redis_prod_data:
    driver: local
