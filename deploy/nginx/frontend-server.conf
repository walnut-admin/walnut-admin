server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 预压缩 .br 文件（构建时 vite-plugin-compression2 生成）
    brotli_static on;
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 20;
    brotli_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 10240;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 静态资源强缓存（文件名带 hash）
    #
    # ⚠️ `immutable` 之所以安全，**完全依赖"这里的文件名都带 hash"这个事实** ——
    # 2026-09-23 实测：该目录下 484 个非压缩文件**全部带 hash**（`about-CmcWJ-55.js` 这种），
    # 换内容必然换文件名，所以不存在"改了用户拿不到"的经典事故。
    # **往这个目录里放稳定名的文件之前先想清楚**：那会让 1 年缓存真的把人锁住。
    #
    # 对照：同级还有 `assets/`（`ai_finish.mp3`、`css/driver-dark.css`）与 `vendor/`
    # （`codeMirror/langs/zh-CN.js`），它们是**稳定名**、**刻意不给缓存头** ⇒ 每次重新验证。
    # 这是有意的取舍：那些文件确实很少变，但"很少变"和"不会变"是两件事，
    # 加长缓存赌错一次就是用户永远拿不到新版。要收益应当先让它们也 hash 化（属构建配置）。
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
