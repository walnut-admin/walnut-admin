server {
    listen 443 ssl;
    server_name api.walnut-admin.com;

    ssl_certificate     /etc/nginx/certs/api.walnut-admin.com.pem;
    ssl_certificate_key /etc/nginx/certs/api.walnut-admin.com.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # ── 安全响应头 ───────────────────────────────────────────────────────────────
    # 为什么 api.conf 也要单独写一份：nginx 的 `add_header` **不跨 server 块继承** ——
    # 这是与 frontend.conf 并列的另一个 server，不会从那边拿到任何头。
    # （2026-09-23 交叉对比时实测发现：api 域名当时一个安全头都没有。）
    # 取值理由与「为什么没有 CSP」见 `frontend.conf` 同名小节（保持一处解释）。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 这 4 条由 `deploy/post-verify.sh` 在每次部署后对**两个域名**逐个核实

    # brotli 动态压缩（模块在 deploy/nginx/Dockerfile 中 load_module）
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 20;
    brotli_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;

    location / {
        proxy_pass http://backend:3000;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
