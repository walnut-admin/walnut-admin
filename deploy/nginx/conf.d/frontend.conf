server {
    listen 80;
    server_name www.walnut-admin.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.walnut-admin.com;

    ssl_certificate     /etc/nginx/certs/www.walnut-admin.com.pem;
    ssl_certificate_key /etc/nginx/certs/www.walnut-admin.com.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # brotli 动态压缩（模块在 deploy/nginx/Dockerfile 中 load_module）
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 20;
    brotli_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;

    # 前端静态文件（frontend 容器）
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API 反代（backend 容器）
    # 带 URI 的 proxy_pass 会把 location 前缀 /api/ 替换为 /w/v1/：
    # /api/auth/login → /w/v1/auth/login（后端 enableVersioning 路由前缀）
    location /api/ {
        proxy_pass http://backend:3000/w/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # Socket 反代（backend 容器 5173 端口）
    location /socket/ {
        proxy_pass http://backend:5173/walnut-path/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 15s;
        proxy_cache_bypass $http_upgrade;
    }
}
