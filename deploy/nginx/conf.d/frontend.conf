server {
    listen 80;
    server_name www.walnut-admin.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.walnut-admin.com;

    ssl_certificate     /etc/nginx/certs/www.walnut-admin.com.pem;
    ssl_certificate_key /etc/nginx/certs/www.walnut-admin.com.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # ── 安全响应头 ───────────────────────────────────────────────────────────────
    # 为什么必须在这一层（公网边缘）加：这是唯一直接面对浏览器的 nginx ——
    # `deploy/nginx/frontend-server.conf` 只服务容器内部（server_name _），加在那里浏览器看不到。
    #
    # ⚠️ `add_header` 的继承规则：**下级块一旦自己写了 `add_header`，上级的全部不再继承**。
    # 所以下面 `location /api/` 里那 4 条是**故意重复**的，不是冗余 —— 它有自己的一条
    # `Access-Control-Allow-Credentials`，不重复就会把安全头吃掉。
    # 新增任何带 `add_header` 的 location 时，都要把这 4 条一并复制过去。
    #
    # 为什么没有 CSP：本仓的 CSP 插件在构建配置里是注释状态（没启用），
    # 贸然在这里加一条会直接打断 SPA（内联脚本 / 样式），而本机无 Docker、加错了要等真部署才发现。
    # 要上 CSP 应当先在构建期把 `vite-plugin-csp-guard` 打开、用 nonce 打通，再回这里收紧。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 这 4 条由 `deploy/post-verify.sh` 在每次部署后逐个核实（本机无 Docker，那是唯一验得到的地方）

    # brotli 动态压缩（模块在 deploy/nginx/Dockerfile 中 load_module）
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 20;
    brotli_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;

    # 前端静态文件（frontend 容器）
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API 反代（backend 容器）
    # 带 URI 的 proxy_pass 会把 location 前缀 /api/ 替换为 /w/v1/：
    # /api/auth/login → /w/v1/auth/login（后端 enableVersioning 路由前缀）
    location /api/ {
        proxy_pass http://backend:3000/w/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Access-Control-Allow-Credentials "true" always;
        # ⚠️ 这 4 条是 server 级安全头的**必要重复**：本 location 自己有一条 add_header，
        # 于是上级的 add_header 全部不再继承（见文件上方那段说明）。少一条就等于 API 响应裸奔。
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Socket 反代（backend 容器 5173 端口）
    location /socket/ {
        proxy_pass http://backend:5173/walnut-path/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 15s;
        proxy_cache_bypass $http_upgrade;
    }
}
