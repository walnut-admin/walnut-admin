# 镜像自带的 nginx.conf —— **不再用 Alpine 包里的那一份**。
#
# 为什么必须自带（2026-09-30 线上实测）：基础镜像是 `alpine:3.21` + `apk add nginx`
# （选它是因为官方 `nginx:alpine` 的 nginx 版本可能比仓库里的 brotli 模块新，ABI 不匹配：
# `module version 1026003 instead of 1027005`）。代价是 Alpine 那份 nginx.conf 把 vhost 目录
# 记作 `/etc/nginx/http.d/`，而我们的 vhost 挂在 `/etc/nginx/conf.d/` ⇒ 文件被包含在 `http` 之外 ⇒
#
#   nginx: [emerg] "server" directive is not allowed here in /etc/nginx/conf.d/api.conf:1
#
# ⇒ nginx 启动即退出 ⇒ 容器 `Restarting (1)` ⇒ 部署末尾的健康检查拿不到 200 ⇒ 整步失败、
# 后面的数据注入被 skip（线上库因此一直是空的）。
#
# 自带这一份之后，"conf.d 在 http 层"这个约定由我们自己保证，与发行版布局无关。
# 本文件在构建期由 Dockerfile 的 `RUN nginx -t` 校验。

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

# brotli 动态模块。两条 glob：Alpine 的 nginx-mod-http-brotli 会放
# /etc/nginx/modules/10_http_brotli.conf；Dockerfile 里的兜底分支会写 /etc/nginx/modules-brotli.conf。
# 用 glob（而不是写死文件名）是因为 include 一个**不存在**的非 glob 文件会直接报错，
# 而 glob 匹配不到是合法的。
include /etc/nginx/modules/*.conf;
include /etc/nginx/modules-*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # 上传体积：与后端的 body 限制保持一致（调大时两边一起改）
    client_max_body_size 20m;

    # 关掉 gzip 由各 vhost 自己决定（frontend 用预压缩的 .br/.gz，见 deploy/nginx/frontend-server.conf）
    gzip off;

    # **关键一行**：vhost 在 http 层被包含
    include /etc/nginx/conf.d/*.conf;
}
