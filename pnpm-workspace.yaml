catalogMode: strict

# 以下 4 项是 pnpm 设置，必须写在 pnpm-workspace.yaml：
# pnpm 只从 .npmrc 读取 auth/registry，其余设置不会生效。
#
# strictPeerDependencies 为 false：本仓多处刻意选用新于上游 peer 范围的版本
# （vite 8、TypeScript 6、class-validator 0.15、@swc/cli 0.8、chokidar 4），
# 与严格模式不兼容。错位仍可用 `pnpm peers check` 查看。
strictPeerDependencies: false
engineStrict: true
# 依赖提升。官方键名是 hoist；hoisting 不是合法键，会被 pnpm 静默忽略
# （pnpm 12 在项目有 packageManager pin 时会直接报 ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS）。
# false = 不做提升：每个包只能解析自己 package.json 中声明的依赖，幻影依赖会被立即暴露。
hoist: false

saveExact: true

# --- 供应链防护（pnpm 12）---
# 新发布的版本需存放满 1440 分钟（1 天）才允许解析安装。显式写出以免默认值变化时无声失效。
minimumReleaseAge: 1440
# hoist: false 的例外清单。每一条都是第三方包自身的缺陷，不是本仓代码问题
# （knip 对自有源码报 0 条未声明依赖）。逐条实测得出，用精确包名而非 glob。
publicHoistPattern:
  # @vueuse/integrations 的可选 peer sortablejs 需要它做类型解析，
  # 否则 useSortable 选项类型退化，admin 的 Table / Tab 类型检查失败。
  - '@types/sortablejs'
  # @unocss/eslint-plugin 的产物 import 它但未声明。
  - '@typescript-eslint/types'
  # langium 源码 import 了 4 个未声明的包（仅经 chevrotain / vscode-languageserver 传递）。
  - '@chevrotain/regexp-to-ast'
  - vscode-jsonrpc
  - vscode-languageserver-protocol
  - vscode-languageserver-types
  # vue-command-palette 产物 import 'vue'，其 package.json 既无 dependencies 也无 peer。
  - vue
  # @nestjs-modules/mailer 的产物 require('lodash')（dist/mailer.service.js），
  # 但它的 package.json 里 dependencies 只有 @css-inline/css-inline / glob / tslib ——
  # lodash 只以 **devDependencies 的 `@types/lodash`** 出现（2.3.4 实测，类型进了依赖、运行时依赖漏了）。
  # 少了它后端**每条启动路径都会挂在引导阶段**：auth → google → shared → welcome → mailer 这条链
  # 一 import 就 `Cannot find module 'lodash'`（错误栈里只有 .pnpm 下的 mailer，看不出是谁漏声明）。
  - lodash
  # 阿里云 SDK 一族（同样只在产物里 require、package.json 里没有；后端 sms/aliyun 那条链一 import 就挂）：
  #   · @alicloud/openapi-core@1.0.8 的 dependencies 写的是改名后的 @darabonba/typescript，
  #     产物却仍 require 老名字 @alicloud/tea-typescript；
  #   · @alicloud/credentials@2.4.5 的 dependencies 里没有 debug。
  # 两条都是用「从 apps/server 编译产物出发走 require 图」扫出来的，不是猜的。
  - '@alicloud/tea-typescript'
  - debug

# 拒绝"可信度下降"的版本：某包此前由可信发布者发布，现在只剩 provenance 或无可信证据时不安装。
trustPolicy: no-downgrade
# 例外：以下均为 2019-2024 年间发布的历史版本，发布时 provenance 机制尚未普及，
# 因而被判为"可信度下降"。这些版本已冻结、被广泛使用，逐条豁免而非整体关闭策略。
trustPolicyExclude:
  - chokidar@4.0.3
  - langium@3.3.1
  - semver@5.7.2
  - semver@6.3.1
  - undici-types@6.21.0
# 阻止传递依赖走 git / 直连 tarball 等异源，只允许从 registry 解析。
blockExoticSubdeps: true

packages:
  - 'apps/*'
  - 'packages/platform-any/*'
  - 'packages/platform-web/*'
  - 'packages/tooling/*'

# --- 发版（pnpm 原生 release management，v11.13+）---
# 本段是版本策略的**唯一真源**（取代原来的 `.changeset/config.json`）。
# 意图文件仍是 changesets 格式（`.changeset/*.md`）：由 `pnpm change` 写、`pnpm version -r` 消费、
# 消费结果记进 `.changeset/ledger.yaml`。发版编排见 packages/tooling/scripts/src/release/。
versioning:
  changelog:
    # `registry` = **不往仓库落 pnpm 自己写的 changelog 文件**。本仓刻意选它：changelog 改由
    # git-cliff 渲染、由 release/changelog.ts 逐包写入（**唯一写入者**）。
    # 为什么不做 `repository`：该模式会主动写 `CHANGELOG.md`，而它没有「关掉写入但保留意图消费」
    # 的开关，于是 git-cliff 再写一次就会让同一版本出现两个 `## X.Y.Z` 段 —— 社区里「git-cliff 写
    # changelog」最常见的翻车形态。storage 只影响「changelog 落在哪」，**意图照旧驱动版本号**。
    # ⚠️ 本模式下 pnpm **不回收**已消费的意图文件（要等 registry 确认该版本已带 changelog 发布，
    # 而本仓包全 private、从不 publish ⇒ 永不回收）；发版脚本消费完当场收走它们
    # （release/generate.ts 的 deleteConsumedIntents()）；判据始终是 ledger，不是文件在不在。
    storage: registry
  # 单一 fixed 组：**全部 15 个 workspace 包永远同版本**，因此发布 tag `vX.Y.Z` 永远有唯一来源。
  #
  # 为什么不做两个组（Apps 3 + Packages 9，历史设计）：fixed 组各自独立，于是一次**只动共享包**的
  # 发版只会 bump Packages 组、apps/admin 的版本不变 ⇒ 编排会命中「版本号未变更，跳过发版」而退出 0，
  # 留下一个**已被 bump 却永远不会打 tag** 的脏工作区。一个组从结构上消灭这条路径。
  # 另：ADR 0008 的标题本就是 Unified Versioning，单组与它一致。
  #
  # ⚠️ 组成员数必须 == 有 version 的 workspace 包数（无例外、无遗漏）：
  #    新增 workspace 包时必须加进来，否则 `pnpm change check` 与 versioning-config.test.ts 都会拦。
  fixed:
    # ⚠️ 类型是 string[][]（组的数组，每组是包名的数组）。单组也要写成嵌套序列。
    -
      - '@walnut/admin'
      - '@walnut/server'
      - '@walnut/docs'
      - '@walnut/utils'
      - '@walnut/contract'
      - '@walnut/types'
      - '@walnut/client'
      - '@walnut/http'
      - '@walnut/ui'
      - '@walnut/eslint-config'
      - '@walnut/commitlint-config'
      - '@walnut/tsconfig'
      - '@walnut/vitest-config'
      - '@walnut/scripts'
      - '@walnut/release'

