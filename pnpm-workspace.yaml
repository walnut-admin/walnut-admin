# 依赖构建脚本：pnpm 10+ 默认全部不执行（供应链防护）。
#
# 为什么必须逐条列出 false：pnpm 要求 allowBuilds 覆盖所有含构建脚本的依赖，
# 缺项时它会自行往本文件写入 "set this to true or false" 占位符（每次 install 都写）。
# 显式 false 是确定性的写法，也让"哪些包被拒绝"一目了然。
#
# strictDepBuilds: false —— 存在被忽略的构建脚本时只告警，不阻断安装。
strictDepBuilds: false
allowBuilds:
  # 以下全部拒绝。原生模块（@swc/core、esbuild、sharp、@parcel/watcher、
  # msgpackr-extract、rs-module-lexer）经 optionalDependencies 分发预编译产物，
  # 不需要构建脚本；@nestjs/core、core-js、@scarf/scarf 的脚本只是 funding/遥测提示。
  # git-cliff 同理（平台二进制走 optionalDependencies，无需 allowBuilds 条目）。
  '@alicloud/openapi-core': false
  '@compodoc/compodoc': false
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  # 两个放行项（`@sentry/cli` 与 `lefthook`），其余全部拒绝。
  #
  # 放行项 ①：Sentry 上传路径本地无法验证（缺真实 DSN/org/project/token），
  # 保留其构建脚本作为低成本保险。
  '@sentry/cli': true
  '@swc/core': false
  core-js: false
  esbuild: false
  json-editor-vue: false
  # 放行项 ②：**lefthook 的 postinstall 就是「装 git 钩子」那一步**（`lefthook install`）。
  # 不放行 ⇒ 钩子不会装，而本仓 `strictDepBuilds: false` 只会**告警**、不阻断安装 ——
  # 那正是「pre-commit / commit-msg / pre-push 门禁全部静默失效」的形态
  # （pnpm 12 迁移时踩过这条）。装没装上用 `pnpm hooks:check` 机械核对。
  lefthook: true
  msgpackr-extract: false
  rs-module-lexer: false
  sharp: false
  vue-demi: false
