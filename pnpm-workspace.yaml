packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: hoisting (migrated from .npmrc shamefully-hoist=true)
hoisting: true

# pnpm 11 catalogs — single source of truth for all shared dependency versions
catalog:
  # ===== Framework =====
  vue: "3.5.34"
  vue-router: "5.0.6"
  vue-i18n: "11.4.2"
  pinia: "3.0.4"
  naive-ui: "2.44.1"
  "@vueuse/core": "14.3.0"
  "@vueuse/integrations": "14.3.0"
  "@vueuse/router": "14.3.0"

  # ===== Runtime shared (2+ consumers) =====
  axios: "1.16.0"
  nanoid: "5.1.11"
  lodash-es: "4.18.1"
  dayjs: "1.11.20"
  easy-fns-ts: "2.1.1"
  echarts: "6.0.0"
  "highlight.js": "11.11.1"
  markdown-it: "14.1.1"
  tinyglobby: "0.2.16"
  compare-versions: "6.1.1"
  cropperjs: "2.1.1"
  "driver.js": "1.4.0"
  sortablejs: "1.15.7"
  superjson: "2.2.6"
  "js-base64": "3.7.8"
  lru-cache: "11.3.6"
  detectincognitojs: "1.6.2"
  idb: "8.0.3"

  # ===== Server runtime =====
  "@nestjs/common": "11.1.17"
  "@nestjs/core": "11.1.17"
  "@nestjs/platform-express": "11.1.17"
  rxjs: "7.8.2"
  reflect-metadata: "0.2.2"
  class-transformer: "0.5.1"
  class-validator: "0.15.1"
  mongoose: "9.3.3"
  winston: "3.19.0"
  passport: "0.7.0"
  passport-jwt: "4.0.1"

  # ===== Build & Dev =====
  typescript: "6.0.3"
  vite: "8.0.11"
  "@vitejs/plugin-vue": "6.0.6"
  "@vitejs/plugin-vue-jsx": "5.1.5"
  vite-plugin-dts: "4.5.4"
  rimraf: "6.1.3"
  taze: "19.11.0"
  "@swc/core": "1.15.21"
  "@types/node": "25.5.0"
  "@types/lodash-es": "4.17.12"
  eslint: "10.3.0"

# Dedup transitive dependencies (was in package.json pnpm.overrides in pnpm <11)
overrides:
  glob: "11.1.0"
  lru-cache: "11.3.6"

# pnpm 11: build allowlist (add entries as pnpm install reports them)
allowBuilds:
  '@alicloud/openapi-core': true
  '@compodoc/compodoc': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@sentry/cli': true
  '@swc/core': true
  core-js: true
  esbuild: true
  json-editor-vue: true
  msgpackr-extract: true
  rs-module-lexer: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
