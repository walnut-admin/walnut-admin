catalogMode: strict

# 以下 4 项是 pnpm 设置，必须写在 pnpm-workspace.yaml：
# pnpm 只从 .npmrc 读取 auth/registry，其余设置不会生效。
#
# strictPeerDependencies 为 false：本仓多处刻意选用新于上游 peer 范围的版本
# （vite 8、TypeScript 6、class-validator 0.15、@swc/cli 0.8、chokidar 4），
# 与严格模式不兼容。错位仍可用 `pnpm peers check` 查看。
strictPeerDependencies: false
engineStrict: true
# 依赖提升。官方键名是 hoist；hoisting 不是合法键，会被 pnpm 静默忽略
# （pnpm 12 在项目有 packageManager pin 时会直接报 ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS）。
# false = 不做提升：每个包只能解析自己 package.json 中声明的依赖，幻影依赖会被立即暴露。
hoist: false

saveExact: true

# --- 供应链防护（pnpm 12）---
# 新发布的版本需存放满 1440 分钟（1 天）才允许解析安装。显式写出以免默认值变化时无声失效。
minimumReleaseAge: 1440
# hoist: false 的例外清单。每一条都是第三方包自身的缺陷，不是本仓代码问题
# （knip 对自有源码报 0 条未声明依赖）。逐条实测得出，用精确包名而非 glob。
publicHoistPattern:
  # @vueuse/integrations 的可选 peer sortablejs 需要它做类型解析，
  # 否则 useSortable 选项类型退化，admin 的 Table / Tab 类型检查失败。
  - '@types/sortablejs'
  # @unocss/eslint-plugin 的产物 import 它但未声明。
  - '@typescript-eslint/types'
  # langium 源码 import 了 4 个未声明的包（仅经 chevrotain / vscode-languageserver 传递）。
  - '@chevrotain/regexp-to-ast'
  - vscode-jsonrpc
  - vscode-languageserver-protocol
  - vscode-languageserver-types
  # vue-command-palette 产物 import 'vue'，其 package.json 既无 dependencies 也无 peer。
  - vue
  # @nestjs-modules/mailer 的产物 require('lodash')（dist/mailer.service.js），
  # 但它的 package.json 里 dependencies 只有 @css-inline/css-inline / glob / tslib ——
  # lodash 只以 **devDependencies 的 `@types/lodash`** 出现（2.3.4 实测，类型进了依赖、运行时依赖漏了）。
  # 少了它后端**每条启动路径都会挂在引导阶段**：auth → google → shared → welcome → mailer 这条链
  # 一 import 就 `Cannot find module 'lodash'`（错误栈里只有 .pnpm 下的 mailer，看不出是谁漏声明）。
  - lodash
  # 阿里云 SDK 一族（同样只在产物里 require、package.json 里没有；后端 sms/aliyun 那条链一 import 就挂）：
  #   · @alicloud/openapi-core@1.0.8 的 dependencies 写的是改名后的 @darabonba/typescript，
  #     产物却仍 require 老名字 @alicloud/tea-typescript；
  #   · @alicloud/credentials@2.4.5 的 dependencies 里没有 debug。
  # 两条都是用「从 apps/server 编译产物出发走 require 图」扫出来的，不是猜的。
  - '@alicloud/tea-typescript'
  - debug
  # express-csp-header@6.3.1 的 dist/index.d.ts 从 'express' 取 RequestHandler / Request /
  # Response，但包没有声明 express / @types/express 依赖；hoist: false 下 .pnpm 的 realpath
  # 解析不到，skipLibCheck 吞掉 d.ts 错误后 expressCspHeader 退化为 error 类型
  # （csp.middleware.ts 的 ts/no-unsafe-call）。
  - '@types/express'
  # nest-winston@2.0.0 的 dist/winston.utilities.d.ts 从 'logform' 取 Format，但 logform
  # 只是 winston 的依赖、不是 nest-winston 的依赖 ⇒ nestLike 返回 error 类型
  # （logger/index.ts 的 ts/no-unsafe-argument）。
  - logform
  # vite-plugin-checker 的 vue-tsc fixture：prepareVueTsc 把解析到的 `typescript`（本仓经
  # catalog/overrides 换成了 TNB）**整目录复制**到 checker 自己的 dist 下，再在副本里
  # `require.resolve('@typescript-native-bridge/<platform>-<arch>')` 找 native bridge。
  # 副本的 node_modules 只有 .bin，兄弟目录的平台包在 hoist: false 下又解析不到 ⇒
  # dev/build 一启动就 `tsgoChecker: bridge shared library not found`、vite 不监听端口。
  # 这里用**scope 内 glob**（只有 7 个平台包，同一发布者、同一用途）：写死单个平台名会让
  # CI（linux-x64）与非 Windows 开发机重蹈覆辙。
  - '@typescript-native-bridge/*'

# 拒绝"可信度下降"的版本：某包此前由可信发布者发布，现在只剩 provenance 或无可信证据时不安装。
trustPolicy: no-downgrade
# 例外：以下均为 2019-2024 年间发布的历史版本，发布时 provenance 机制尚未普及，
# 因而被判为"可信度下降"。这些版本已冻结、被广泛使用，逐条豁免而非整体关闭策略。
trustPolicyExclude:
  - chokidar@4.0.3
  - langium@3.3.1
  - semver@5.7.2
  - semver@6.3.1
  # tsrs 是 2026-10 起由 oxc-project 发布的那一个包（0.0.0 的 description 与 repository 就
  # 指向 oxc-project/tsrs，名字历来属于本项目），但 2026-10 起的版本改用 GitHub Actions OIDC
  # 发布（`_npmUser` = GitHub Actions，带 SLSA provenance + registry 签名，7.1.0-beta.tsrs5 实测）；
  # pnpm 的 no-downgrade 把「发布者从个人账号换成 OIDC」判成 `possible package takeover`，
  # 整包所有版本都被拒。**只豁免要装的那一个精确版本**，策略本身不关（执行计划 §9.1、§11 第 7 行）。
  - tsrs@7.1.0-beta.tsrs5
  - undici-types@6.21.0
# 阻止传递依赖走 git / 直连 tarball 等异源，只允许从 registry 解析。
blockExoticSubdeps: true

packages:
  - 'apps/*'
  - 'packages/platform-any/*'
  - 'packages/platform-web/*'
  # 生成物包（2026-11 批次 4 · D9：@walnut/api-types 从 platform-web 挪到这里）。
  # 判据是「谁产生它」而不是「谁消费它」：它由 openapi-typescript 从 apps/server/openapi.json
  # 机械生成、一个字都不手写，和手写的 platform-web 包放在同一组只会让「这个目录能不能手改」
  # 这件事继续含糊。boundaries 侧对应 tag generated（见根 turbo.json）。
  - 'packages/generated/*'
  # 工具链包（2026-11 阶段 1：从 packages 下的 tooling 组提到仓库根）。判据是「给仓库自己用、
  # 不随业务发布」：它们要么是各工具按约定来读的配置预设，要么是仓库级门禁 / 发版 bin，
  # 唯一的消费者是本仓的配置与根脚本。与 apps、packages 同级后，「这棵树不属于业务」一眼可见；
  # 与 Turborepo 官方把 tooling 放进 packages 的建议不同，理由见 ADR 0028。
  - 'tooling/*'

# --- 发版（pnpm 原生 release management，v11.13+）---
# 本段是版本策略的**唯一真源**（取代原来的 `.changeset/config.json`）。
# 意图文件仍是 changesets 格式（`.changeset/*.md`）：由 `pnpm change` 写、`pnpm version -r` 消费、
# 消费结果记进 `.changeset/ledger.yaml`。发版编排见 tooling/release/src/release/。
versioning:
  changelog:
    # `registry` = **不往仓库落 pnpm 自己写的 changelog 文件**。本仓刻意选它：changelog 改由
    # git-cliff 渲染、由 release/changelog.ts 逐包写入（**唯一写入者**）。
    # 为什么不做 `repository`：该模式会主动写 `CHANGELOG.md`，而它没有「关掉写入但保留意图消费」
    # 的开关，于是 git-cliff 再写一次就会让同一版本出现两个 `## X.Y.Z` 段 —— 社区里「git-cliff 写
    # changelog」最常见的翻车形态。storage 只影响「changelog 落在哪」，**意图照旧驱动版本号**。
    # 本模式下 pnpm **不回收**已消费的意图文件（要等 registry 确认该版本已带 changelog 发布，
    # 而本仓包全 private、从不 publish ⇒ 永不回收）；发版脚本消费完当场收走它们
    # （release/generate.ts 的 deleteConsumedIntents()）；判据始终是 ledger，不是文件在不在。
    storage: registry
  # 单一 fixed 组：**全部 workspace 包永远同版本**（成员 = 有 version 的包，两个集合逐名相等由
  # versioning-config.test.ts 机械拦），因此发布 tag `vX.Y.Z` 永远有唯一来源。
  #
  # 为什么不做两个组（Apps 3 + Packages 9，历史设计）：fixed 组各自独立，于是一次**只动共享包**的
  # 发版只会 bump Packages 组、apps/admin 的版本不变 ⇒ 编排会命中「版本号未变更，跳过发版」而退出 0，
  # 留下一个**已被 bump 却永远不会打 tag** 的脏工作区。一个组从结构上消灭这条路径。
  # 另：ADR 0008 的标题本就是 Unified Versioning，单组与它一致。
  #
  # 组成员数必须 == 有 version 的 workspace 包数（无例外、无遗漏）：
  #    新增 workspace 包时必须加进来，否则 `pnpm change check` 与 versioning-config.test.ts 都会拦。
  fixed:
    # 类型是 string[][]（组的数组，每组是包名的数组）。单组也要写成嵌套序列。
    - - '@walnut/admin'
      - '@walnut/e2e'
      - '@walnut/server'
      - '@walnut/docs'
      - '@walnut/utils'
      - '@walnut/contract'
      - '@walnut/types'
      - '@walnut/client'
      - '@walnut/http'
      - '@walnut/api-types'
      - '@walnut/eslint-config'
      - '@walnut/commitlint-config'
      - '@walnut/tsconfig'
      - '@walnut/vitest-config'
      - '@walnut/vite-config'
      - '@walnut/scripts'
      - '@walnut/release'

# 批次 8（P5c）实验态：catalog 换成 TNB 之后，**还要**用 overrides 强制传递依赖走同一包面。
# 只改 catalog 时，未在 package.json 直接声明 typescript 的包仍会解析到 stock TS
# （catalog 只管显式写 `catalog:` 的声明）；nest CLI 从仓库根解析，必须拿到 TNB 外壳。
overrides:
  typescript: npm:typescript-native-bridge@6.0.3-bridge.19.tsgo.7.0.2

